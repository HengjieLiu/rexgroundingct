schema_version: "1.0"
id: asd_060_persistence_tree_set_verifier
title: Multi-Threshold Persistence-Tree Set Verifier
plan_revision: 2
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 8
idea: >-
  Build component persistence forests across sixteen thresholds, measure an
  exact variable-set oracle, and train a context-aware antichain verifier only
  when oracle headroom and safe tri-state evidence justify it.
problem: >-
  The report shows large component-oracle headroom but nearly no gain from
  independent component classifiers. Findings can contain zero, one, or many
  components, and partial labels make binary candidate targets unsafe.
novelty_vs_report: >-
  Previous selectors scored fixed-threshold components independently. This
  plan represents threshold evolution explicitly, decodes an antichain set,
  optimizes union utility, and branches on separately verified tri-state
  evidence instead of treating every zero-overlap component as negative.
hypotheses:
  primary: >-
    A persistence-tree set verifier will recover at least 20% of an oracle gain
    of at least 0.07, beat an identical-feature independent scorer, and retain
    at least 99% of baseline true-positive voxels.
  null: >-
    Persistence and set context do not improve component selection after
    controlling features, candidate forest, lineage, and evaluation.
goals:
  - Quantify candidate-set headroom before training a selector.
  - Distinguish candidate-generation failure from selection failure.
  - Model variable-cardinality component sets with ancestor exclusion.
  - Consume only verified upstream GO signals and safe ASD-040 tri-state semantics.
non_goals:
  - Train when oracle headroom or candidate recall is inadequate.
  - Treat zero GT overlap as definite negative without ASD-040 certification.
  - Deploy an independent binary component selector.
  - Add new proposal, zoom, or full-resolution inference paths.
evidence_references:
  - source: experiments_aiselfdrive/ReXGroundingCT_Technical_Report_2026-07-30.md
    sections: ["7.3", "8.1", "8.2", "13.3", "13.5", "14", "15"]
    availability: historical_only
  - source: asd_000_evidence_lock_error_atlas
    artifact_ids:
      - locked_lineage_manifest
      - val80_manifest
      - val120_manifest
      - val200_manifest
      - revision_2_logit_source
    availability: missing
  - source: asd_040_censored_label_tri_state
    artifact_ids:
      - tri_state_policy_artifact
      - diagnostic_report
    availability: missing
lineage:
  parent_checkpoint: /mnt/shengdata1/hengjie/experiments/rexgroundingct/009_voxtell_s3_attention_coupling_ablation/runs/exp009_s3_attention_20260727T081747Z/baseline_cont100/model_epoch100/fold_0/checkpoint_final.pth
  parent_checkpoint_sha256: 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf
  logit_source_projection: experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/results/revision_2_logit_source.json
  logit_resolution_contract: Resolve and hash manifest_path from the verified projection, require equality with manifest_sha256, and consume only files declared by the resolved manifest.
  preprocessing_class: unchanged
  model_weights_frozen_during_candidate_and_feature_extraction: true
  prompt_form: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/prompt_form
  inference_window: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/inference_window
  threshold_policy: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/threshold_policy
  postprocessing: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/postprocessing
  candidate_threshold_policy: method_variable_only_for_candidate_forest
  comparability_rule: >-
    Baseline, oracle, deterministic controls, independent scorer, and set
    verifier use the identical logit tensor, candidate forest, features, cohort,
    and union reconstruction.
data:
  training_source: official_rexgroundingct_train_only
  development_cohort:
    id: val80
    manifest: experiments_aiselfdrive/shared/manifests/val80_development_seed20260731.json
    allowed_stages:
      - build_val80_oracle
      - decision_t3
  internal_replication_cohort:
    id: val120
    manifest: experiments_aiselfdrive/shared/manifests/val120_internal_replication_seed20260731.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
    evidence_role: historically_exposed_internal_replication_not_independent_confirmation
  continuity_cohort:
    id: val200
    manifest: configs/evaluation/rexgroundingct_val200_seed20260723.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
  candidate_thresholds:
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
  connectivity: 26
  supervision_states:
    known_positive: released-mask-overlapping candidate evidence
    certified_negative: accepted only from a verified ASD-040 GO policy
    unknown: every candidate not known-positive or certified-negative
    unknown_loss_weight: 0.0
  leakage_controls:
    - Oracle GT is available only to oracle/evaluator code and never to learned features.
    - Training and validation patients are disjoint.
    - val80 selects method and gates only.
    - val120 and val200 paths are rejected before confirm_t4.
method:
  persistence_forest:
    node: one_26_connected_component_at_one_threshold
    edge: >-
      A child at the next higher threshold links to the lower-threshold
      component with maximum voxel overlap; ties use smaller parent canonical
      rank. Zero-overlap nodes start a new root.
    canonical_node_id: case_finding_threshold_index_component_rank
    component_rank: descending_voxel_count_then_lexicographic_min_voxel
    selection_constraint: antichain_no_ancestor_descendant_pair
    empty_set_allowed: true
  exact_oracle:
    objective: maximum_finding_dice_of_selected_union
    solver: dinkelbach_fractional_tree_dynamic_program
    convergence_tolerance: 1.0e-9
    tie_break:
      - higher_dice
      - fewer_selected_nodes
      - lower_total_predicted_volume
      - lexicographic_node_ids
    gt_usage: evaluator_only
  candidate_recall:
    definition: >-
      Micro fraction of released GT connected components with at least one
      voxel overlap from any candidate node at any threshold.
  feature_registry:
    mandatory:
      - threshold_and_persistence_length
      - component_probability_statistics
      - physical_volume_surface_and_centroid
      - parent_child_probability_and_geometry_deltas
      - native_resolution_local_image_evidence
      - frozen_prompt_component_compatibility
    optional_upstream:
      - experiment_id: asd_010_intrinsic_anatomy_fields
        include_if: finished_go_and_verified_manifest_at_validate_locked_inputs
        feature: intrinsic_anatomy_energy
      - experiment_id: asd_020_factorial_pathology_anatomy_binding
        include_if: finished_go_and_verified_manifest_at_validate_locked_inputs
        feature: pathology_anatomy_binding_score
      - experiment_id: asd_030_anatomy_certified_fp_replay
        include_if: finished_go_and_verified_manifest_at_validate_locked_inputs
        feature: anatomy_certification_and_replay_score
    freeze_rule: >-
      Check once during validate_locked_inputs; include every and only verified
      finished/go signal then hash the registry. Do not wait for optional
      experiments or change the registry later.
  set_model:
    label_sufficiency_gate:
      certified_negative_nodes_min: 500
      certified_negative_cases_min: 50
      known_positive_nodes_min: 500
      tri_state_policy_case_coverage_fraction_min: 0.90
      failure_action: Skip T1 through T4 and close inconclusive with exact counts; never relax the gate.
    node_encoder:
      hidden_dimension: 128
      layers: 2
      activation: relu
    context_encoder:
      architecture: set_transformer
      self_attention_blocks: 2
      heads: 4
      hidden_dimension: 128
      dropout: 0.10
    node_utility_head:
      hidden_dimension: 64
      output: scalar
    decoder: exact_maximum_utility_antichain_tree_dp_with_empty_option
    training_targets:
      known_positive: positive_utility
      certified_negative: negative_utility
      unknown: zero_supervision_weight
    loss:
      structured_antichain_cross_entropy_weight: 1.0
      soft_known_positive_union_dice_weight: 0.20
      certified_negative_union_penalty_weight: 0.20
      unknown_weight: 0.0
    optimizer:
      name: adamw
      learning_rate: 0.0001
      betas: [0.9, 0.999]
      epsilon: 1.0e-8
      weight_decay: 0.0001
  controls:
    - id: locked_baseline
      rule: locked_threshold_and_postprocessing
    - id: oracle
      rule: exact_gt_antichain
    - id: top1
      rule: highest_probability_branch
    - id: topk
      rule: k_selected_on_training_fold_from_1_2_3_5
    - id: persistence_only
      rule: longest_branch_then_probability
    - id: independent_identical_features
      rule: same_node_encoder_without_set_context_then_same_antichain_decoder
    - id: shuffled_set_context
      rule: context_nodes_permuted_across_findings_within_category
    - id: set_verifier
      rule: declared_context_model_and_antichain_decoder
  decision_branches:
    oracle_gate_fail:
      learned_stages: skipped
      outcome: no_go
      interpretation: candidate_forest_has_insufficient_headroom_or_recall
    oracle_gate_pass_and_asd040_go:
      learned_stages: eligible_only_if_label_sufficiency_gate_passes
    oracle_and_asd040_go_but_label_counts_fail:
      learned_stages: skipped
      outcome: inconclusive
      interpretation: safe_policy_exists_but_certified_training_evidence_is_insufficient
    oracle_gate_pass_and_asd040_no_go_or_inconclusive:
      learned_stages: skipped
      outcome: inconclusive
      interpretation: headroom_exists_but_safe_training_labels_are_unavailable
  compute_ladder:
    oracle: T0
    smoke_t1_updates: 10
    pilot_t2_updates: 500
    decision_t3_updates: 2000
    confirm_t4_updates: 10000
    update_semantics: cumulative_global_update_barriers
    scheduler_contract: One immutable 10,000-update cosine horizon; every arm resumes its own prior-barrier full scheduler state without restart, warmup replay, or horizon mutation.
    t4_matched_start: Set-verifier treatment and identical-feature independent control each resume their own matched 2,000-update T3 full state; a fresh control is prohibited.
    maximum_parallel_single_gpu_arms: 4
