  - id: closeout
    kind: closeout
    execution_mode: agent
    needs: [resolve_tri_state_branch]
    required: true
    description: Close from oracle-only or learned evidence using the preregistered branch and claims.
    instructions:
      - Inspect the branch decision and all completion markers.
      - If oracle failed, close no_go and state candidate generation is limiting for this forest.
      - If oracle passed but ASD-040 lacked a GO policy, close inconclusive and preserve oracle evidence.
      - If learned stages ran, apply the exact recovery, independent-control, retention, and CI gates.
      - Write result.json and summary.md, decide claims, verify artifacts, and request skipped optional stages through experimentctl.
