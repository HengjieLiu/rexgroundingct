stages:
  - id: implement_persistence_set_pipeline
    kind: implementation
    execution_mode: agent
    needs: []
    required: true
    description: Implement deterministic forests, exact oracle/decoder, tri-state set training, controls, and tests.
    instructions:
      - Read this plan, configs/protocol.yaml, dependency states/manifests, and applicable README files.
      - Implement only inside this experiment's scripts, src, and tests directories.
      - Use the exact threshold list, canonical IDs, edge/tie rules, Dinkelbach oracle, and antichain constraint.
      - Isolate evaluator GT from learned features and set unknown supervision weight to zero.
      - Freeze optional upstream features exactly once by terminal state, GO outcome, and verified artifact manifest.
      - Enforce the exact certified-negative, known-positive, case-coverage, full-state resume, and matched independent-control contracts from protocol.yaml.
      - Resolve manifest_path from the verified ASD-000 revision-2 logit-source projection, hash it, require equality with manifest_sha256, and consume only files declared by that resolved manifest.
      - Implement branch outcomes, sealed-cohort guards, deterministic seed 20260731, and atomic JSON completion records.
      - Consume controller env REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, and REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL; label every nested container rexgroundingct.aiselfdrive.lease with the lease ID and rexgroundingct.aiselfdrive.experiment with the experiment ID, and never hard-code container names or lease values.
      - Emit metrics.resources in every stage evidence with incremental gpu_hours, incremental cpu_hours, and cumulative experiment runtime-tree high-water storage_gib.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/scripts
      - experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/src
      - experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/tests
      - experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/results/implementation_evidence.json
    inputs: [experiment_plan, protocol_config, locked_lineage_manifest, asd040_state, asd040_artifact_manifest]
    outputs: [set_verifier_source_package, set_verifier_test_suite]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/results/implementation_evidence.json
      require_git_diff_within_allowed_paths: true
    resources:
      cpu_cores: 8
      gpu_count: 0
    timeout_seconds: 18000
    retry:
      max_attempts: 1
      backoff_seconds: []
      retryable_classes: []
    stop_conditions: [write_scope_violation, unresolved_dependency_interface]
    acceptance_checks:
      - Synthetic forests prove canonical edges, antichain decoding, and exact oracle optimality.
      - Unknown nodes have zero supervised gradient.
      - No existing repository source outside this experiment is modified.
