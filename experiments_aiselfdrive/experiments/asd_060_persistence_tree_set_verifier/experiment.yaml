      - Outcome follows the declared oracle/ASD-040 branch exactly.
      - Negative scientific evidence is no_go or inconclusive rather than failed.
      - Every claim cites verified evidence and no evaluator GT appears in learned features.
evaluation:
  bootstrap:
    seed: 20260731
    draws: 10000
    units: [finding, case_cluster]
  oracle_metrics:
    - locked_baseline_dice
    - exact_oracle_dice
    - oracle_dice_gain
    - gt_component_recall
    - gt_voxel_coverage
  learned_metrics:
    - paired_dice_delta
    - oracle_gain_fraction_recovered
    - baseline_true_positive_voxel_retention
    - selected_component_count_distribution
    - detached_fp_reduction
    - empty_prediction_delta
  gates:
    oracle_go:
      - oracle_dice_gain >= 0.07
      - gt_component_recall >= 0.85
    learned_go:
      - oracle_gain_fraction_recovered >= 0.20
      - set_verifier_dice > independent_identical_features_dice
      - baseline_true_positive_voxel_retention >= 0.99
      - paired_case_clustered_ci_lower > 0
    label_sufficiency_go:
      - certified_negative_nodes >= 500
      - certified_negative_cases >= 50
      - known_positive_nodes >= 500
      - tri_state_policy_case_coverage_fraction >= 0.90
    internal_replication_go:
      - val120_paired_case_clustered_ci_lower > 0
      - val120_baseline_true_positive_voxel_retention >= 0.99
      - matched_independent_control_completed == true
promotion_contract:
  artifact_id: promotion_record
  path: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/promotions/asd_060_persistence_tree_set_verifier.json
  exact_producer: experimentctl promote
  required_fields: [schema_version, experiment_id, source, portfolio_sha256, plan_sha256, t3_evidence_sha256, rank, promoted_at, matched_control_required, val120_access_authorized]
  validation: Require matching experiment and plan, source experimentctl promote, matched_control_required true, val120_access_authorized true, and SHA-256 equality with controller event and state.
paths:
  workspace: experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier
  config: experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/configs/protocol.yaml
  runtime: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_060_persistence_tree_set_verifier/run_v1
  artifact_manifest: experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/artifacts/manifest.json
  result: experiments_aiselfdrive/experiments/asd_060_persistence_tree_set_verifier/results/result.json
budget:
  gpu_hours_max: 48
  cpu_hours_max: 2000
  durable_storage_gib_max: 1800
  maximum_gpu_hours: 48
  maximum_wall_hours: 84
  maximum_external_storage_gib: 1800
  terminate_on_exhaustion: true
retention:
  durable:
    - frozen_feature_registry
    - val80_persistence_forest
    - oracle_report
    - branch_decision
    - selected_full_state_checkpoints
    - metrics_and_closeout
  regenerable:
    - training_forest_features
    - unselected_checkpoints
  ephemeral:
    - docker_scratch
    - partial_exports
prohibited_directions:
  - learned_training_before_oracle_gate
  - learned_training_without_asd040_go_policy
  - zero_gt_overlap_as_automatic_negative
  - evaluator_gt_in_learned_features
  - deployable_independent_binary_selector
  - single_component_only_output
  - automatic_zoom
  - full_resolution_s3
  - hard_lobe_clipping
  - generic_presence_head
  - slurm
