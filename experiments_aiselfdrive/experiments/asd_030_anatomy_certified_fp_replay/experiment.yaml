        CUDA_DEVICE_ORDER: PCI_BUS_ID
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_030_anatomy_certified_fp_replay/run_v1/t3
    inputs: [t2_checkpoints, immutable_replay_manifest, val80_manifest]
