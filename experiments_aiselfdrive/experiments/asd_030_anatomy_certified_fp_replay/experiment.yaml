schema_version: "1.0"
id: asd_030_anatomy_certified_fp_replay
title: Anatomy-Certified Baseline False-Positive Replay
plan_revision: 1
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 5
idea: >-
  Mine high-scoring false components from the immutable baseline and train
  patch rejection only on components whose incompatibility is certified by
  prompt semantics and verified thoracic anatomy.
problem: >-
  Full-volume inference repeatedly applies a positive prompt to locally
  plausible but wrong regions. Ordinary background losses and hard negatives
  conflate definite background with plausible unannotated disease.
novelty_vs_report: >-
  The report used generic hard negatives and brittle anatomy filtering. This
  plan uses anatomy only to certify a sparse replay label, leaves compatible
  unlabeled tissue unknown, and measures whether model-mined negatives explain
  the prompt-off-location error before spending training compute.
hypotheses:
  primary: >-
    Anatomy-certified model-mined replay will reduce val80 prompt-off-location
    false-positive volume by at least 20% while preserving recall within two
    percentage points and improving paired Dice by at least 0.005.
  null: >-
    Certified replay will not outperform count-matched random certified
    negatives under matched lineage, updates, threshold, and post-processing.
goals:
  - Quantify how much baseline off-location error is covered by certifiable mined candidates.
  - Build an immutable tri-state replay set without converting unknown regions to negatives.
  - Compare mined certified replay against matched baseline and causal controls.
  - Preserve exact parent lineage, positive evidence, and evaluation calibration.
non_goals:
  - Add anatomy features or anatomy-query coupling to VoxTell.
  - Train a new proposal generator or refresh mining from intervention checkpoints.
  - Treat compatible unlabeled regions as empty.
  - Combine this intervention with another self-drive method.
evidence_references:
  - source: experiments_aiselfdrive/ReXGroundingCT_Technical_Report_2026-07-30.md
    sections: ["3.3", "4.2", "7.3", "9.1", "9.3", "13.5", "14"]
    availability: historical_only
  - source: asd_000_evidence_lock_error_atlas
    artifact_ids:
      - locked_lineage_manifest
      - val80_manifest
      - val120_manifest
      - val200_manifest
      - prompt_ontology
      - baseline_error_atlas
    availability: missing
  - source: asd_005_train_anatomy_asset_extension
    artifact_ids: [train_anatomy_manifest]
    availability: missing
lineage:
  parent_experiment: 009_voxtell_s3_attention_coupling_ablation
  parent_checkpoint: resolved_from_asd_000_locked_lineage_manifest
  parent_checkpoint_sha256: resolved_before_execution
  optimizer_restore: false
  initialization: weights_only_for_all_training_arms
  preprocessing_class: cached-equivalent
  normalization: locked_parent_per_volume_zscore
  inference_window: locked_by_asd_000
  prompt_form: locked_by_asd_000
  threshold_policy: locked_by_asd_000
  postprocessing: locked_by_asd_000
  comparability_rule: >-
    Every arm uses the same initialization, materialized sample schedule,
    update count, prompt, inference, threshold, and post-processing.
data:
  training_source: official_rexgroundingct_train_only
  development_cohort:
    id: val80
    manifest: resolved_from_asd_000
    allowed_stages:
      - coverage_gate
      - pilot_t2
      - decision_t3
  confirmatory_cohort:
    id: val120
    manifest: resolved_from_asd_000
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
  continuity_cohort:
    id: val200
    manifest: resolved_from_asd_000
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
  case_separation:
    patient_key: ct_filename_patient_prefix
    train_validation_overlap_allowed: false
  supervision_states:
    known_positive: >-
      Released finding-mask voxels and candidate components with any released
      finding-mask overlap. This state takes precedence over every certificate.
    certified_negative: >-
      A candidate from a geometry-QC-passed case whose high-confidence explicit
      side or lobe allowed region, dilated 15 mm in physical space, has zero
      voxel intersection with the component, and at least 90% of that component
      lies inside a verified incompatible lung or lobe region.
    unknown: >-
      Every unlabeled compatible region, ambiguous prompt, unsupported anatomy
      phrase, anatomy-QC failure, component touching the allowed dilation, or
      region outside the supported certificate domain.
  label_precedence: [known_positive, certified_negative, unknown]
  leakage_controls:
    - Mining and replay construction use official training cases only.
    - val80 selects gates and arms but never contributes training samples.
    - val120 and val200 paths must be rejected by all stages before confirm_t4.
method:
  baseline_candidate_mining:
    probability_threshold: 0.20
    connectivity: 26
    score: mean_top_1_percent_probability
    ranks_to_record: [1, 3, 5]
    crop_shape_voxels: [192, 192, 192]
    source_model: immutable_asd_000_baseline
    one_mining_pass_only: true
  certification:
    parser: frozen_high_confidence_asd_000_prompt_ontology
    supported_targets:
      - left_lung
      - right_lung
      - left_upper_lobe
      - left_lower_lobe
      - right_upper_lobe
      - right_middle_lobe
      - right_lower_lobe
    allowed_region_dilation_mm: 15
    require_anatomy_geometry_qc: true
    require_zero_allowed_region_intersection: true
    minimum_incompatible_region_fraction: 0.90
    compatible_unlabeled_action: mask_loss
  replay:
    positive_per_group: 1
    random_certified_per_group: 1
    mined_certified_per_group: 1
    manifest_mutability: immutable_after_hash
    refresh_policy: prohibited
    negative_loss_domain: certified_negative_voxels_only
    unknown_loss_weight: 0.0
  arms:
    - id: matched_baseline
      sampler: locked_parent_sampler
      negative_supervision: locked_parent
    - id: random_certified
      sampler: count_matched_random_certified
      negative_supervision: certified_voxels_only
    - id: mined_certified
      sampler: baseline_score_ranked_certified
      negative_supervision: certified_voxels_only
    - id: mined_uncertified_masked
      sampler: baseline_score_ranked_unknown
      negative_supervision: none_unknown_masked
    - id: shuffled_prompt_mining
      sampler: shuffled_prompt_candidates
      negative_supervision: only_independently_certified_voxels
  compute_ladder:
    pilot_t2_updates: 500
    decision_t3_updates: 2000
    confirm_t4_updates: 10000
    parallelism: maximum_four_single_gpu_arms
    evaluation_barrier: true
  controls:
    - count-matched random certified negatives
    - mined but uncertified crops with unknown loss masked
    - shuffled-prompt mining with independent certification
    - matched baseline sampler
resources:
  hardware_profile: experiments_aiselfdrive/shared/hardware_profile.yaml
  execution_environment: docker
  training_image: rexgroundingct-voxtell:cu126
  gpu_model: NVIDIA RTX 6000 Ada Generation
  gpu_count_available: 4
  gpu_memory_gib_each: 47.38
  minimum_free_gib_training: 36
  maximum_parallel_arms: 4
  multi_gpu_ddp: false
  slurm: prohibited
  runtime_root: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_030_anatomy_certified_fp_replay/run_v1
stages:
  - id: implement_replay_pipeline
    kind: implementation
    execution_mode: agent
    needs: []
    required: true
    description: Implement the isolated mining, certification, replay, training, and evaluation package.
    instructions:
      - Read this plan, configs/protocol.yaml, dependency manifests, and all applicable README files.
      - Implement only under this experiment's scripts, src, and tests directories.
      - Resolve dependency artifacts through their verified manifests; never hard-code historical report paths.
      - Make tri-state precedence explicit and ensure unknown voxels have zero negative loss.
      - Write completion markers atomically as JSON containing plan hash, command, input hashes, output hashes, counts, and timestamps.
      - Make all scripts deterministic under seed 20260731 and reject val120 or val200 unless stage is confirm_t4 with promotion evidence.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/scripts
      - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/src
      - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/tests
      - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/results/implementation_evidence.json
    inputs:
      - experiment_plan
      - protocol_config
      - dependency_manifests
    outputs:
      - replay_source_package
      - replay_test_suite
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/results/implementation_evidence.json
      require_git_diff_within_allowed_paths: true
    resources:
      cpu_cores: 8
      gpu_count: 0
    timeout_seconds: 14400
    retry:
      max_attempts: 1
      backoff_seconds: []
      retryable_classes: []
    stop_conditions:
      - write_scope_violation
      - unresolved_dependency_interface
    acceptance_checks:
      - Every declared script has --help and import-safe main guards.
      - Tests cover label precedence, physical dilation, unknown masking, deterministic mining, and leakage rejection.
      - No existing repository source outside this experiment is modified.
  - id: validate_locked_inputs
    kind: validation
    execution_mode: command
    needs: [implement_replay_pipeline]
    required: true
    description: Validate lineage, cohorts, anatomy geometry, source hashes, and implementation tests.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/scripts/validate_inputs.py
        - --config
        - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/configs/protocol.yaml
      cwd: /home/hengjie/code_sync/rexgroundingct
      env:
        PYTHONDONTWRITEBYTECODE: "1"
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_030_anatomy_certified_fp_replay/run_v1/validation
    inputs:
      - locked_lineage_manifest
      - val80_manifest
      - train_anatomy_manifest
      - replay_source_package
    outputs: [input_validation_report]
    completion:
      marker: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_030_anatomy_certified_fp_replay/run_v1/completion/validate_locked_inputs.json
      required_fields: [plan_sha256, input_sha256, cohort_counts, geometry_checks, test_summary]
    resources:
      cpu_cores: 16
      gpu_count: 0
    timeout_seconds: 7200
    retry:
      max_attempts: 1
      backoff_seconds: []
      retryable_classes: []
    stop_conditions:
      - checkpoint_hash_drift
      - cohort_hash_drift
      - split_leakage
      - geometry_mismatch
      - orientation_mismatch
    acceptance_checks:
      - Dependency artifacts are verified and match their manifests.
      - Training and validation patient sets are disjoint.
      - All anatomy arrays align in physical geometry with their CT sources.
  - id: docker_gpu_preflight
    kind: preflight
    execution_mode: command
    needs: [validate_locked_inputs]
    required: true
    description: Verify Docker CUDA, four expected GPUs, memory, checkpoint loading, and one finite inference.
    command:
      argv:
