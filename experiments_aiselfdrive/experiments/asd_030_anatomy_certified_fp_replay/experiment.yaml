schema_version: "1.0"
id: asd_030_anatomy_certified_fp_replay
title: Anatomy-Certified Baseline False-Positive Replay
plan_revision: 2
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 5
idea: >-
  Mine high-scoring false components from the immutable baseline and train
  patch rejection only on components whose incompatibility is certified by
  prompt semantics and verified thoracic anatomy.
problem: >-
  Full-volume inference repeatedly applies a positive prompt to locally
  plausible but wrong regions. Ordinary background losses and hard negatives
  conflate definite background with plausible unannotated disease.
novelty_vs_report: >-
  The report used generic hard negatives and brittle anatomy filtering. This
  plan uses anatomy only to certify a sparse replay label, leaves compatible
  unlabeled tissue unknown, and measures whether model-mined negatives explain
  the prompt-off-location error before spending training compute.
hypotheses:
  primary: >-
    Anatomy-certified model-mined replay will reduce val80 prompt-off-location
    false-positive volume by at least 20% while preserving recall within two
    percentage points and improving paired Dice by at least 0.005.
  null: >-
    Certified replay will not outperform count-matched random certified
    negatives under matched lineage, updates, threshold, and post-processing.
goals:
  - Quantify how much baseline off-location error is covered by certifiable mined candidates.
  - Build an immutable tri-state replay set without converting unknown regions to negatives.
  - Compare mined certified replay against matched baseline and causal controls.
  - Preserve exact parent lineage, positive evidence, and evaluation calibration.
non_goals:
  - Add anatomy features or anatomy-query coupling to VoxTell.
  - Train a new proposal generator or refresh mining from intervention checkpoints.
  - Treat compatible unlabeled regions as empty.
  - Combine this intervention with another self-drive method.
evidence_references:
  - source: experiments_aiselfdrive/ReXGroundingCT_Technical_Report_2026-07-30.md
    sections: ["3.3", "4.2", "7.3", "9.1", "9.3", "13.5", "14"]
    availability: historical_only
  - source: asd_000_evidence_lock_error_atlas
    artifact_ids:
      - locked_lineage_manifest
      - val80_manifest
      - val120_manifest
      - val200_manifest
      - prompt_ontology
      - baseline_error_atlas
    availability: missing
  - source: asd_005_train_anatomy_asset_extension
    artifact_ids: [train_anatomy_manifest]
    availability: missing
lineage:
  parent_experiment: 009_voxtell_s3_attention_coupling_ablation
  parent_checkpoint: /mnt/shengdata1/hengjie/experiments/rexgroundingct/009_voxtell_s3_attention_coupling_ablation/runs/exp009_s3_attention_20260727T081747Z/baseline_cont100/model_epoch100/fold_0/checkpoint_final.pth
  parent_checkpoint_sha256: 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf
  optimizer_restore: false
  initialization: weights_only_for_all_training_arms
  preprocessing_class: cached-equivalent
  normalization: locked_parent_per_volume_zscore
  inference_window: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/inference_window
  prompt_form: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/prompt_form
  threshold_policy: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/threshold_policy
  postprocessing: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/postprocessing
  comparability_rule: >-
    Every arm uses the same initialization, materialized sample schedule,
    update count, prompt, inference, threshold, and post-processing.
data:
  training_source: official_rexgroundingct_train_only
  development_cohort:
    id: val80
    manifest: experiments_aiselfdrive/shared/manifests/val80_development_seed20260731.json
    allowed_stages:
      - coverage_gate
      - pilot_t2
      - decision_t3
  internal_replication_cohort:
    id: val120
    manifest: experiments_aiselfdrive/shared/manifests/val120_internal_replication_seed20260731.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
    evidence_role: historically_exposed_internal_replication_not_independent_confirmation
  continuity_cohort:
    id: val200
    manifest: configs/evaluation/rexgroundingct_val200_seed20260723.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
  case_separation:
    patient_key: ct_filename_patient_prefix
    train_validation_overlap_allowed: false
  supervision_states:
    known_positive: >-
      Released finding-mask voxels and candidate components with any released
      finding-mask overlap. This state takes precedence over every certificate.
    certified_negative: >-
      A candidate from a geometry-QC-passed case whose high-confidence explicit
      side or lobe allowed region, dilated 15 mm in physical space, has zero
      voxel intersection with the component, and at least 90% of that component
      lies inside a verified incompatible lung or lobe region.
    unknown: >-
      Every unlabeled compatible region, ambiguous prompt, unsupported anatomy
      phrase, anatomy-QC failure, component touching the allowed dilation, or
      region outside the supported certificate domain.
  label_precedence: [known_positive, certified_negative, unknown]
  leakage_controls:
    - Mining and replay construction use official training cases only.
    - val80 selects gates and arms but never contributes training samples.
    - val120 and val200 paths must be rejected by all stages before confirm_t4.
method:
  baseline_candidate_mining:
    probability_threshold: 0.20
    connectivity: 26
    score: mean_top_1_percent_probability
    ranks_to_record: [1, 3, 5]
    crop_shape_voxels: [192, 192, 192]
    source_model: lineage.parent_checkpoint with lineage.parent_checkpoint_sha256
    one_mining_pass_only: true
  certification:
    parser: frozen_high_confidence_asd_000_prompt_ontology
    supported_targets:
      - left_lung
      - right_lung
      - left_upper_lobe
      - left_lower_lobe
      - right_upper_lobe
      - right_middle_lobe
      - right_lower_lobe
    allowed_region_dilation_mm: 15
    require_anatomy_geometry_qc: true
    require_zero_allowed_region_intersection: true
    minimum_incompatible_region_fraction: 0.90
    compatible_unlabeled_action: mask_loss
  replay:
    positive_per_group: 1
    random_certified_per_group: 1
    mined_certified_per_group: 1
    manifest_mutability: immutable_after_hash
    refresh_policy: prohibited
    negative_loss_domain: certified_negative_voxels_only
    unknown_loss_weight: 0.0
  arms:
    - id: matched_baseline
      sampler: locked_parent_sampler
      negative_supervision: locked_parent
    - id: random_certified
      sampler: count_matched_random_certified
      negative_supervision: certified_voxels_only
    - id: mined_certified
      sampler: baseline_score_ranked_certified
      negative_supervision: certified_voxels_only
    - id: mined_uncertified_masked
      sampler: baseline_score_ranked_unknown
      negative_supervision: none_unknown_masked
    - id: shuffled_prompt_mining
      sampler: shuffled_prompt_candidates
      negative_supervision: only_independently_certified_voxels
  compute_ladder:
    smoke_t1_updates: 10
    pilot_t2_updates: 500
    decision_t3_updates: 2000
    confirm_t4_updates: 10000
    update_semantics: cumulative_global_update_barriers
    scheduler_contract: One immutable 10,000-update polynomial horizon; every arm resumes its own prior-barrier full scheduler state without restart, warmup replay, or horizon mutation.
    t4_matched_start: Mined-certified treatment and matched-baseline disabled-replay control each resume their own matched 2,000-update T3 full state; a fresh control is prohibited.
    parallelism: maximum_four_single_gpu_arms
    evaluation_barrier: true
  controls:
    - count-matched random certified negatives
    - mined but uncertified crops with unknown loss masked
    - shuffled-prompt mining with independent certification
    - matched baseline sampler
