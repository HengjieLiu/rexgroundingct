  - id: closeout
    kind: closeout
    execution_mode: agent
    needs: [coverage_gate]
    required: true
    description: Decide claims and produce a compact, hash-backed closeout for the deepest executed gate.
    instructions:
      - Inspect all completion markers and determine which optional stages were eligible and executed.
      - Use preregistered gates exactly; do not tune thresholds or reinterpret unknown labels.
      - Write results/result.json and results/summary.md with paired metrics, confidence intervals, caveats, and artifact paths.
      - Update claims.yaml verdicts and artifacts/manifest.json statuses and hashes.
      - Request experimentctl to skip ineligible optional stages and finish with go, no_go, inconclusive, or invalid.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/results
      - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/claims.yaml
