      cwd: /home/hengjie/code_sync/rexgroundingct
      env:
        PYTHONDONTWRITEBYTECODE: "1"
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_030_anatomy_certified_fp_replay/run_v1/replay
