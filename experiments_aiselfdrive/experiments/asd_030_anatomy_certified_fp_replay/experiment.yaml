      - Each device has at least 36 GiB free.
      - Parent checkpoint loads and one-case inference is finite.
  - id: mine_baseline_candidates
    kind: data_generation
    execution_mode: command
    needs: [docker_gpu_preflight]
    required: true
    description: Run one immutable baseline mining pass over official training cases.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/scripts/mine_candidates.py
        - --config
