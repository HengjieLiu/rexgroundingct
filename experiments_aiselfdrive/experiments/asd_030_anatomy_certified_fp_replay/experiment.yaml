evaluation:
  bootstrap:
    seed: 20260731
    draws: 10000
    units: [finding, case_cluster]
  primary_metrics:
    - paired_dice_delta
    - prompt_off_location_fp_volume_reduction
    - recall_delta
  safety_metrics:
    - hit_rate_delta
    - empty_prediction_delta
    - known_positive_retention
    - unknown_negative_loss_violations
  secondary_metrics:
    - certified_negative_top1_percent_probability
    - detached_component_count
    - threshold_matched_dice
    - predicted_volume_matched_dice
  gates:
    coverage_go: certified_top5_off_location_fp_coverage >= 0.30
    pilot_go:
      - certified_negative_peak_probability_reduction >= 0.30
      - positive_gt_probability_relative_change >= -0.05
    decision_go:
      - prompt_off_location_fp_volume_reduction >= 0.20
      - recall_delta >= -0.02
      - paired_dice_delta >= 0.005
    pairwise_causal_go:
      - mined_minus_random_off_location_fp_reduction > 0
      - mined_minus_random_paired_dice_delta > 0
      - mined_minus_random_case_clustered_ci_lower > 0
    internal_replication_go:
      - val120_case_clustered_ci_lower > 0
promotion_contract:
  artifact_id: promotion_record
  path: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/promotions/asd_030_anatomy_certified_fp_replay.json
  exact_producer: experimentctl promote
  required_fields: [schema_version, experiment_id, source, portfolio_sha256, plan_sha256, t3_evidence_sha256, rank, promoted_at, matched_control_required, val120_access_authorized]
  validation: Require matching experiment and plan, source experimentctl promote, matched_control_required true, val120_access_authorized true, and SHA-256 equality with controller event and state.
