    outputs: [final_result, final_summary, final_claims, verified_artifact_manifest]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/results/closeout_evidence.json
      require_all_executed_stage_artifacts_verified: true
    resources:
      cpu_cores: 8
      gpu_count: 0
