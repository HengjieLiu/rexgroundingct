      - Read this plan, configs/protocol.yaml, dependency manifests, and all applicable README files.
      - Implement only under this experiment's scripts, src, and tests directories.
      - Resolve dependency artifacts through their verified manifests; never hard-code historical report paths.
      - Make tri-state precedence explicit and ensure unknown voxels have zero negative loss.
      - Write completion markers atomically as JSON containing plan hash, command, input hashes, output hashes, counts, and timestamps.
      - Make all scripts deterministic under seed 20260731 and reject val120 or val200 unless stage is confirm_t4 with promotion evidence.
      - Consume controller env REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, and REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL; label every nested container rexgroundingct.aiselfdrive.lease with the lease ID and rexgroundingct.aiselfdrive.experiment with the experiment ID, and never hard-code container names or lease values.
