      - lineage_mismatch
      - non_finite
      - budget_exhausted
    acceptance_checks:
      - Every expected training finding has a terminal mining record.
      - Candidate ranks and hashes are deterministic on a repeated fixed sample.
      - No intervention checkpoint is used for mining.
  - id: certify_freeze_replay
