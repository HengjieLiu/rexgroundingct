      - Mined-certified peak probability mass falls at least 30%.
      - Mean positive GT probability remains within 5% relative of matched baseline.
  - id: decision_t3
    kind: training
    execution_mode: command
    needs: [pilot_t2]
    required: false
    description: Continue the matched baseline and passing replay arm to 2,000 updates and evaluate val80.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_030_anatomy_certified_fp_replay/scripts/run_training.py
