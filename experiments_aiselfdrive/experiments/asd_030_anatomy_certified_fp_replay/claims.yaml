    type: performance
    statement: >-
      The selected replay arm reduces prompt-off-location FP by at least 20%,
      improves paired Dice by at least 0.005, and loses no more than two
      percentage points of recall on val80.
    verdict: pending
    gate_refs:
      - evaluation.gates.decision_go
      - evaluation.gates.confirmation_go
    evidence_refs: []
    decided_at: null
    rationale: null
