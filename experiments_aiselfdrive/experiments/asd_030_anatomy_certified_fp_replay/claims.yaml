    type: safety
    statement: >-
      Known-positive precedence has zero violations, unknown voxels receive
      zero negative loss, and positive GT probability is preserved within 5%
      during the pilot.
    verdict: pending
    gate_refs:
      - evaluation.gates.pilot_go
      - stages.certify_freeze_replay.acceptance_checks
    evidence_refs: []
