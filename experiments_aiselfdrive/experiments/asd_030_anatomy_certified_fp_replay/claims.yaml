    type: feasibility
    statement: >-
      A deterministic immutable replay manifest can be constructed from the
      locked baseline while preserving tri-state supervision and cohort
      separation.
    verdict: pending
    gate_refs:
      - stages.certify_freeze_replay.acceptance_checks
    evidence_refs: []
    decided_at: null
    rationale: null
  - id: certified_candidates_cover_error
    type: mechanistic
    statement: >-
      Anatomy-certified top-five baseline candidates explain at least 30% of
      val80 prompt-off-location false-positive volume.
    verdict: pending
    gate_refs:
      - evaluation.gates.coverage_go
    evidence_refs: []
    decided_at: null
    rationale: null
  - id: mined_beats_random_certificate
    type: causal
    statement: >-
      Model-mined certified replay outperforms count-matched random certified
      replay under identical initialization, schedule, and evaluation.
    verdict: pending
    gate_refs:
      - evaluation.gates.decision_go
    evidence_refs: []
    decided_at: null
    rationale: null
