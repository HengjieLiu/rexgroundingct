schema_version: "1.0"
id: asd_050_prompt_equivariance_quartet
title: Prompt-Aware Left/Right Equivariance Quartet
plan_revision: 2
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 7
idea: >-
  Couple exact left/right image reflection with exact prompt rewriting and
  local counterfactual abstention so the model learns directional
  text-image alignment rather than generic flip invariance.
problem: >-
  The report shows that laterality words strongly move predictions, but the
  response is coarse and sometimes unsafe. Ordinary image augmentation cannot
  teach whether prompt, image, and mask changed coherently.
novelty_vs_report: >-
  Prior prompt swaps were mechanistic audits and prior shuffled-prompt losses
  were disabled prototypes. This plan creates a geometry-verified four-condition
  causal unit with factual segmentation and mask-local counterfactual
  suppression, never a global empty target.
hypotheses:
  primary: >-
    Quartet training will produce the correct 0.05 factual-counterfactual score
    ordering in at least 80% of eligible examples and reduce real laterality
    off-target FP by at least 15% without aggregate Dice loss beyond 0.001.
  null: >-
    Coordinated quartet supervision will not outperform factual joint flip plus
    prompt swap under a matched schedule.
goals:
  - Build a deterministic, orientation-safe unilateral prompt rewrite set.
  - Separate coordinated alignment learning from image-only, prompt-only, and sham effects.
  - Improve laterality compliance without creating factual empty masks.
  - Preserve unknown labels outside known counterfactual-negative masks.
non_goals:
  - Map right middle lobe to lingula or infer non-equivalent lobar anatomy.
  - Train on bilateral, diffuse, vague, or mixed-laterality prompts.
  - Apply global empty supervision to a counterfactual scan.
  - Claim general superior/inferior equivariance from a left/right experiment.
evidence_references:
  - source: experiments_aiselfdrive/ReXGroundingCT_Technical_Report_2026-07-30.md
    sections: ["5.3", "6.3", "9.6", "13.2", "14"]
    availability: historical_only
  - source: asd_000_evidence_lock_error_atlas
    artifact_ids:
      - locked_lineage_manifest
      - val80_manifest
      - val120_manifest
      - val200_manifest
      - prompt_ontology
      - baseline_error_atlas
    availability: missing
lineage:
  parent_checkpoint: /mnt/shengdata1/hengjie/experiments/rexgroundingct/009_voxtell_s3_attention_coupling_ablation/runs/exp009_s3_attention_20260727T081747Z/baseline_cont100/model_epoch100/fold_0/checkpoint_final.pth
  parent_checkpoint_sha256: 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf
  optimizer_restore: false
  initialization: weights_only_for_every_arm
  preprocessing_class: cached-equivalent
  normalization: locked_parent_per_volume_zscore
  prompt_form: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/prompt_form
  inference_window: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/inference_window
  threshold_policy: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/threshold_policy
  postprocessing: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/postprocessing
  comparability_rule: >-
    All arms use identical initialization, materialized examples, update
    counts, optimizer settings, evaluation thresholds, and post-processing.
data:
  training_source: official_rexgroundingct_train_only
  eligibility:
    parser_confidence: high
    laterality_count: exactly_one
    allowed_prompt_targets:
      - left_lung
      - right_lung
      - left_upper_lobe
      - right_upper_lobe
      - left_lower_lobe
      - right_lower_lobe
    minimum_mask_fraction_on_parsed_side: 0.99
    maximum_mask_voxels_across_midline: 0
  exclusions:
    - bilateral_or_multifocal_language
    - right_middle_lobe
    - rml
    - lingula_or_lingular
    - diffuse_or_widespread
    - vague_or_nonlocalizable
    - multiple_or_conflicting_laterality_mentions
    - prompt_rewrite_not_round_trip_exact
    - orientation_or_affine_qc_failure
    - mask_crosses_midsagittal_plane
  prompt_swap:
    strategy: token_boundary_placeholder_substitution
    pairs:
      - [left, right]
      - [Left, Right]
      - [LEFT, RIGHT]
      - [LUL, RUL]
      - [LLL, RLL]
      - [left_upper_lobe, right_upper_lobe]
      - [left_lower_lobe, right_lower_lobe]
    round_trip_requirement: swap_twice_byte_identical
    other_text_changes_allowed: false
  reflection:
    canonical_orientation: RAS
    axis: physical_left_right_axis
    operation: reverse_canonical_array_axis_0_while_retaining_canonical_frame
    center: volume_midplane
    apply_identically_to: [ct, finding_mask, known_negative_mask]
    round_trip_tolerance_voxels: 0
    affine_tolerance: 1.0e-6
  quartet_states:
    original_factual:
      image: original
      prompt: original
      target: known_positive_original_mask
    flipped_factual:
      image: left_right_flipped
      prompt: left_right_swapped
      target: known_positive_flipped_mask
    original_counterfactual:
      image: original
      prompt: left_right_swapped
      target: certified_negative_original_mask_only
      elsewhere: unknown
    flipped_counterfactual:
      image: left_right_flipped
      prompt: original
      target: certified_negative_flipped_mask_only
      elsewhere: unknown
  development_cohort:
    id: val80
    manifest: experiments_aiselfdrive/shared/manifests/val80_development_seed20260731.json
    allowed_stages: [baseline_quartet_audit, pilot_t2, decision_t3]
  internal_replication_cohort:
    id: val120
    manifest: experiments_aiselfdrive/shared/manifests/val120_internal_replication_seed20260731.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
    evidence_role: historically_exposed_internal_replication_not_independent_confirmation
  continuity_cohort:
    id: val200
    manifest: configs/evaluation/rexgroundingct_val200_seed20260723.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
  leakage_controls:
    - Training quartet cases are official train only.
    - val80 is evaluation and model-selection evidence only.
    - val120 and val200 paths are rejected before confirm_t4.
method:
  loss:
    factual_segmentation_weight_each: 1.0
    counterfactual_local_bce_weight_each: 0.10
    factual_counterfactual_margin_weight_each: 0.05
    margin: 0.05
    counterfactual_loss_domain: known_source_or_flipped_mask_only
    unknown_loss_weight: 0.0
  quartet_pass_definition: >-
    Both original-factual minus original-counterfactual and flipped-factual
    minus flipped-counterfactual mean known-mask scores are at least 0.05.
  arms:
    - id: no_flip_baseline
      examples: original_factual_only
    - id: factual_joint_flip_text
      examples: [original_factual, flipped_factual]
    - id: full_quartet
      examples:
        - original_factual
        - flipped_factual
        - original_counterfactual
        - flipped_counterfactual
    - id: image_only_control
      examples: original_plus_flipped_image_without_prompt_swap
      eligible_for_selection: false
    - id: prompt_only_control
      examples: original_image_with_swapped_prompt_and_original_mask
      eligible_for_selection: false
    - id: sham_identity_control
      examples: original_plus_flip_unflip_roundtrip_with_original_prompt
      eligible_for_selection: false
  arm_execution:
    waves:
      - [no_flip_baseline, factual_joint_flip_text, full_quartet, sham_identity_control]
      - [image_only_control, prompt_only_control]
    checkpoint_initialization_reset_each_wave: true
    evaluation_after_all_waves: true
  compute_ladder:
    smoke_t1_updates: 10
    pilot_t2_updates: 500
    decision_t3_updates: 2000
    confirm_t4_updates: 10000
    update_semantics: cumulative_global_update_barriers
    scheduler_contract: One immutable 10,000-update polynomial horizon; every arm resumes its own prior-barrier full scheduler state without restart, warmup replay, or horizon mutation.
    t4_matched_start: Full-quartet treatment and no-flip control each resume their own matched 2,000-update T3 full state; a fresh control is prohibited.
    maximum_parallel_single_gpu_arms: 4
    multi_gpu_ddp: false
resources:
  hardware_profile: experiments_aiselfdrive/shared/hardware_profile.yaml
  execution_environment: docker
  image: rexgroundingct-voxtell:cu126
  local_image_id: sha256:8ff421d05fbf6044553ba987d065a4d6fdaaaab8e2913272e620d08c4c286e0f
  gpu_model: NVIDIA RTX 6000 Ada Generation
  gpu_count_available: 4
  minimum_free_gib_training: 36
  slurm: prohibited
  runtime_root: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1
stage_execution_contract:
  resource_limits:
    cpu_cores_hardware_max: 128
    gpu_count_hardware_max: 4
    gpu_count_per_arm_max: 1
    maximum_concurrent_arms: 4
    inference_free_memory_gib_min: 32
    training_free_memory_gib_min: 36
    multi_gpu_ddp: prohibited
  evidence:
    applies_to: every_stage
    object_path: metrics.resources
    required_fields: [gpu_hours, cpu_hours, storage_gib]
    semantics:
      gpu_hours: incremental_stage_gpu_hours
      cpu_hours: incremental_stage_cpu_hours
      storage_gib: cumulative_experiment_runtime_tree_high_water_at_stage_completion
    validation: All values are finite and nonnegative; storage_gib is measured over the experiment runtime tree and never reported as a stage delta.
  controller_container_identity:
    required_environment: [REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL]
    required_labels:
      lease: rexgroundingct.aiselfdrive.lease=REXGROUNDINGCT_AISELFDRIVE_LEASE_ID
      experiment: rexgroundingct.aiselfdrive.experiment=REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID
    rule: Every nested docker run consumes controller-provided values and applies both exact labels; container names and lease values are never hard-coded.
stages:
  - id: implement_quartet_pipeline
    kind: implementation
    execution_mode: agent
    needs: []
    required: true
    description: Implement exact prompt swapping, physical LR reflection, quartet losses, controls, metrics, and tests.
    instructions:
      - Read this plan, configs/protocol.yaml, ASD-000 manifests, and applicable README files.
      - Implement only inside this experiment's scripts, src, and tests directories.
      - Identify left/right from physical orientation and canonicalize to RAS; never assume a source array axis.
      - Implement sentinel-based byte-round-trip prompt swaps and reject every declared exclusion.
      - Apply counterfactual loss only on the certified known mask and explicitly mask all other voxels unknown.
      - Add pre-T4 cohort guards, deterministic seed 20260731, and atomic JSON completion records.
      - Consume controller env REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, and REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL; label every nested container rexgroundingct.aiselfdrive.lease with the lease ID and rexgroundingct.aiselfdrive.experiment with the experiment ID, and never hard-code container names or lease values.
      - Emit metrics.resources in every stage evidence with incremental gpu_hours, incremental cpu_hours, and cumulative experiment runtime-tree high-water storage_gib.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/scripts
      - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/src
      - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/tests
      - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/results/implementation_evidence.json
    inputs: [experiment_plan, protocol_config, locked_lineage_manifest]
    outputs: [quartet_source_package, quartet_test_suite]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/results/implementation_evidence.json
      require_git_diff_within_allowed_paths: true
    resources:
      cpu_cores: 8
      gpu_count: 0
    timeout_seconds: 14400
    retry:
      max_attempts: 1
      backoff_seconds: []
      retryable_classes: []
    stop_conditions: [write_scope_violation, unresolved_dependency_interface]
    acceptance_checks:
      - Prompt swapping is byte-exact after a double swap.
      - CT and mask double reflection are bit-exact and affine QC passes.
      - Counterfactual gradients are zero outside known masks.
  - id: validate_and_build_quartets
    kind: data_generation
    execution_mode: command
    needs: [implement_quartet_pipeline]
    required: true
    description: Validate lineage/orientation and freeze eligible train and val80 quartet manifests.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/scripts/build_quartets.py
        - --config
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/configs/protocol.yaml
      cwd: /home/hengjie/code_sync/rexgroundingct
      env:
        PYTHONDONTWRITEBYTECODE: "1"
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/quartets
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/validate_and_build_quartets.json
    inputs: [locked_lineage_manifest, val80_manifest, prompt_ontology]
    outputs: [quartet_manifest, quartet_qc_report]
    completion:
      marker: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/validate_and_build_quartets.json
      required_fields: [train_count, val80_count, exclusion_counts, orientation_checks, roundtrip_checks, manifest_sha256]
    resources:
      cpu_cores: 32
      gpu_count: 0
    timeout_seconds: 14400
    retry:
      max_attempts: 1
      backoff_seconds: []
      retryable_classes: []
    stop_conditions: [orientation_mismatch, split_leakage, prompt_roundtrip_failure, cohort_hash_drift]
    acceptance_checks:
      - Every included prompt has exactly one supported unilateral target.
      - Every mask is at least 99% on the parsed side and has zero voxels across the midplane.
      - Every declared exclusion has a recorded reason and no excluded case enters a quartet.
  - id: docker_gpu_preflight
    kind: preflight
    execution_mode: command
    needs: [validate_and_build_quartets]
    required: true
    description: Verify Docker GPUs, parent checkpoint, exact identity inference, and finite quartet inference.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/scripts/gpu_preflight.py
        - --config
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/configs/protocol.yaml
      cwd: /home/hengjie/code_sync/rexgroundingct
      env:
        CUDA_DEVICE_ORDER: PCI_BUS_ID
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/preflight
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/docker_gpu_preflight.json
