evaluation:
  bootstrap:
    seed: 20260731
    draws: 10000
    units: [quartet, finding, case_cluster]
  synthetic_metrics:
    - paired_known_mask_score_margins
    - quartet_ordering_rate
    - factual_empty_rate
  real_metrics:
    - laterality_off_target_fp_volume
    - laterality_compliance
    - paired_dice_delta
    - hit_rate_delta
    - empty_prediction_delta
  gates:
    pilot_go:
      - quartet_ordering_rate_at_margin_0_05 >= 0.80
      - factual_empty_rate_delta <= 0
    decision_go:
      - laterality_off_target_fp_reduction >= 0.15
      - laterality_compliance_delta >= 0.10
      - aggregate_paired_dice_delta >= -0.001
      - full_quartet_alignment_metric > factual_joint_alignment_metric
    internal_replication_go:
      - val120_laterality_case_clustered_ci_lower > 0
      - val120_paired_dice_delta >= -0.001
