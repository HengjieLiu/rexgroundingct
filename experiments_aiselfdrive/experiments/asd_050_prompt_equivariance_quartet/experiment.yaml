    completion:
      marker: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/pilot_t2.json
      required_fields: [wave_initialization_hashes, arm_updates, quartet_ordering, factual_empty_rates, gate_verdict, output_sha256]
    resources:
      cpu_cores: 32
      gpu_count: 4
      gpu_count_per_arm: 1
      arm_count: 6
      maximum_concurrent_arms: 4
      minimum_free_gib_per_gpu: 36
      maximum_updates_per_arm: 500
      gpu_hours_per_arm_max: 1.25
      execution_waves: 2
    timeout_seconds: 43200
    retry:
      max_attempts: 2
      automatic_full_state_resumes: 1
      retryable_classes: [container_start_failure, transient_io]
    stop_conditions: [identity_control_failure, non_finite, missing_resume_state, budget_exhausted]
    acceptance_checks:
      - Every arm has identical parent weights and exactly 500 optimizer updates.
      - Full-quartet ordering rate is at least 0.80 with margin 0.05.
      - Full-quartet factual empty rate does not exceed the no-flip baseline.
      - Image-only and prompt-only controls are reported but never eligible for selection.
  - id: decision_t3
    kind: training
    execution_mode: command
    needs: [pilot_t2]
    required: false
    description: Continue no-flip baseline, factual-joint, and full-quartet arms to 2,000 updates and evaluate val80.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/scripts/run_training.py
        - --config
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/configs/protocol.yaml
        - --tier
        - T3
      cwd: /home/hengjie/code_sync/rexgroundingct
      env:
        CUDA_DEVICE_ORDER: PCI_BUS_ID
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/t3
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/decision_t3.json
    inputs: [t2_checkpoints, quartet_manifest, val80_manifest]
    outputs: [t3_checkpoints, t3_metrics]
    completion:
      marker: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/decision_t3.json
