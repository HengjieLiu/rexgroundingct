    outputs: [gpu_preflight_report]
    completion:
      marker: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/docker_gpu_preflight.json
      required_fields: [image_digest, gpu_inventory, free_memory_gib, checkpoint_sha256, identity_metrics, finite_quartet]
    resources:
      cpu_cores: 8
      gpu_count: 1
      gpu_count_per_arm: 1
      arm_count: 1
      maximum_concurrent_arms: 1
      minimum_free_gib_per_gpu: 32
      gpu_hours_total_max: 0.25
    timeout_seconds: 3600
    retry:
      max_attempts: 1
      resource_wait_attempts: 360
      resource_wait_seconds: 60
      retryable_classes: [resource_unavailable]
    stop_conditions: [wrong_inference_device, checkpoint_hash_drift, identity_control_failure, non_finite]
    acceptance_checks:
      - Docker inspect image ID equals sha256:8ff421d05fbf6044553ba987d065a4d6fdaaaab8e2913272e620d08c4c286e0f.
      - Four NVIDIA RTX 6000 Ada Generation GPUs are available in Docker with at least 36 GiB free each.
      - Parent checkpoint SHA-256 equals 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf.
      - Epoch-zero no-flip inference matches the locked baseline within 1e-6 logits and exact hit count.
      - A fixed factual/counterfactual quartet produces finite outputs.
  - id: baseline_quartet_audit
    kind: diagnostic
    execution_mode: command
    needs: [docker_gpu_preflight]
    required: true
    description: Record the frozen baseline quartet ordering and factual empty rate on val80.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/scripts/evaluate_quartets.py
        - --config
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/configs/protocol.yaml
        - --checkpoint-source
        - baseline
        - --cohort
        - val80
      cwd: /home/hengjie/code_sync/rexgroundingct
      env:
        CUDA_DEVICE_ORDER: PCI_BUS_ID
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/baseline_audit
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/baseline_quartet_audit.json
    inputs: [quartet_manifest, locked_parent_checkpoint, val80_manifest]
    outputs: [baseline_quartet_report]
    completion:
      marker: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/baseline_quartet_audit.json
      required_fields: [eligible_quartets, ordering_rate, factual_empty_rate, laterality_compliance, output_sha256]
    resources:
      cpu_cores: 16
      gpu_count: 4
      gpu_count_per_arm: 1
      arm_count: 4
      maximum_concurrent_arms: 4
      minimum_free_gib_per_gpu: 32
      gpu_hours_total_max: 4
    timeout_seconds: 14400
    retry:
      max_attempts: 3
      backoff_seconds: [60, 300]
      retryable_classes: [container_start_failure, transient_io]
    stop_conditions: [orientation_mismatch, non_finite, split_leakage]
    acceptance_checks:
      - Both factual and both counterfactual known-mask scores are recorded per quartet.
      - Off-target FP uses prompt-specified laterality, not GT-positive lobe statistics.
  - id: t1_resume_smoke
    kind: smoke
    execution_mode: command
    needs: [baseline_quartet_audit]
    required: true
    description: Run ten train-only updates for no-flip, factual-joint, full-quartet, and sham arms and prove exact new-process resume.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/scripts/run_training.py, --config, experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/configs/protocol.yaml, --tier, T1]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {CUDA_DEVICE_ORDER: PCI_BUS_ID}
    allowed_write_paths:
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/t1
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/t1_resume_smoke.json
    inputs: [quartet_manifest, locked_parent_checkpoint]
    outputs: [t1_full_state_checkpoints, t1_resume_report]
    completion:
      marker: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/t1_resume_smoke.json
      required_fields: [arm_updates, uninterrupted_trace_sha256, resumed_trace_sha256, checkpoint_sha256, exact_match]
    resources: {cpu_cores: 16, gpu_count: 4, gpu_count_per_arm: 1, arm_count: 4, maximum_concurrent_arms: 4, minimum_free_gib_per_gpu: 36, maximum_updates_per_arm: 10, gpu_hours_per_arm_max: 0.25}
    timeout_seconds: 7200
    retry: {max_attempts: 2, automatic_full_state_resumes: 1, retryable_classes: [container_start_failure, transient_io]}
    stop_conditions: [orientation_mismatch, non_finite, missing_resume_state, sample_schedule_mismatch]
    acceptance_checks:
      - All arms start from the exact pinned parent and use byte-identical train-only sample schedules.
      - New-process five-plus-five updates exactly match uninterrupted ten-update global step, sample order, parameters, logits, and loss trace.
      - Atomic checkpoints contain every protocol-required state field and each arm uses less than 0.25 GPU-hour.
  - id: pilot_t2
    kind: training
    execution_mode: command
    needs: [t1_resume_smoke]
    required: true
    description: Run six 500-update arms in two matched waves and evaluate all arms after the barrier.
    command:
      argv:
        - python
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/scripts/run_training.py
        - --config
        - experiments_aiselfdrive/experiments/asd_050_prompt_equivariance_quartet/configs/protocol.yaml
