      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_050_prompt_equivariance_quartet/run_v1/completion/pilot_t2.json
    inputs: [t1_full_state_checkpoints, quartet_manifest, locked_parent_checkpoint, val80_manifest]
