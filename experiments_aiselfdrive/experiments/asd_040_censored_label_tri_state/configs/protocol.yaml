schema_version: "1.0"
experiment_id: asd_040_censored_label_tri_state
seed: 20260731
controller_runtime_contract:
  required_environment: [REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL]
  nested_docker_labels:
    lease: rexgroundingct.aiselfdrive.lease=REXGROUNDINGCT_AISELFDRIVE_LEASE_ID
    experiment: rexgroundingct.aiselfdrive.experiment=REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID
  rule: Consume controller-provided values at execution time, apply both exact labels to every nested docker run, and never hard-code container names or lease values.
stage_evidence_contract:
  object_path: metrics.resources
  required_fields: [gpu_hours, cpu_hours, storage_gib]
  semantics: gpu_hours and cpu_hours are incremental for the completed stage; storage_gib is the cumulative experiment runtime-tree high-water observed at completion, never a stage delta.
runtime_root: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_040_censored_label_tri_state/run_v1
parent:
  checkpoint: /mnt/shengdata1/hengjie/experiments/rexgroundingct/009_voxtell_s3_attention_coupling_ablation/runs/exp009_s3_attention_20260727T081747Z/baseline_cont100/model_epoch100/fold_0/checkpoint_final.pth
  sha256: 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf
entity_extraction:
  source: released_finding_mask_at_native_geometry
  connectivity: 26
  foreground_rule: voxel_value_greater_than_zero
  minimum_voxels: 8
  component_identity: sha256_case_name_finding_index_component_voxel_index_digest
  canonical_order: descending_voxel_count_then_ascending_centroid_ras_z_y_x_then_component_identity
  eligibility: at_least_two_components_after_minimum_voxel_filter
  discarded_component_policy: record_count_and_volume_never_merge_into_kept_entity
  geometry_validation: finite_affine_matching_ct_shape_and_axis_codes_required
eligibility:
  recorded_entities_min: 2
  cases_min: 50
  trials_min: 100
censorship_rules:
  volume_priority: hide_smallest_canonical_entity
  centrality_priority: hide_entity_with_largest_physical_distance_from_case_lung_centroid
  report_order_proxy: hide_last_canonical_entity
  report_order_semantics: >-
    The released data provide no entity-level report order; this deterministic
    annotation-order proxy must be reported as a proxy and never interpreted as
    clinical report order.
  seeded_random: hide_seeded_uniform_entity
crossfit:
  folds: 5
  unit: patient
  assignment: sha256_patient_id_mod_5
  hidden_label_calibration:
    geometry_owner: isolated_evaluator_only
    training_feature_process_receives_hidden_geometry: false
    training_feature_process_receives_hidden_size_or_location: false
    evaluator_target: candidate_overlaps_hidden_entity_at_iou_at_least_0_10
    calibration_rule: >-
      For each outer fold, the isolated evaluator may provide opaque
      trial-level binary targets from the other four folds to fit the diagnostic
      calibrator and choose its precision threshold. Held-out-fold hidden labels
      are used only once for scoring. No hidden geometry or per-entity derived
      feature crosses the evaluator boundary.
    final_training_policy: freeze_aggregate_out_of_fold_threshold_and_feature_model_before_any_segmentation_training
    prohibited: [same_fold_target_fitting, heldout_threshold_tuning, hidden_geometry_export, hidden_size_feature, hidden_location_feature]
states:
  precedence: [known_positive, certified_negative, unknown]
  unknown_negative_loss_weight: 0.0
  certified_negative_domain: verified_zero_padding_synthetic_decoys
candidate_thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
diagnostic_model:
  hidden_units: 128
  hidden_layers: 2
  dropout: 0.10
  optimizer:
    name: AdamW
    learning_rate: 0.001
    betas: [0.9, 0.999]
    epsilon: 1.0e-8
    weight_decay: 0.0001
  schedule:
    maximum_epochs: 100
    batch_size: 128
    warmup_epochs: 5
    post_warmup: cosine_decay_to_zero
    early_stopping: prohibited
policies: [background_bce, unknown_ignore, nnpu, pseudo_positive]
training:
  updates: {T1: 10, T2: 500, T3: 2000, T4: 10000}
  update_semantics: cumulative_global_update_barriers
  batch_size_per_gpu: 1
  gradient_accumulation: 1
  optimizer:
    name: SGD
    momentum: 0.99
    nesterov: true
    weight_decay: 0.00003
    parameter_groups: {encoder_lr: 0.00001, non_encoder_lr: 0.0001}
  schedule:
    unit: optimizer_update
    horizon_updates: 10000
    warmup_updates: 100
    warmup: linear_from_zero_to_group_base_lr
    post_warmup: polynomial_decay_to_zero
    polynomial_power: 0.9
    horizon_rule: immutable_cumulative_10000_update_horizon
    restart_rule: each_arm_resumes_its_own_prior_barrier_full_scheduler_state_without_restart_or_horizon_mutation
    tier_barriers: [10, 500, 2000, 10000]
    t4_start_rule: selected_policy_and_disabled_parent_loss_control_each_resume_their_own_matched_2000_update_t3_full_state
  precision: {autocast: bf16, optimizer_state: fp32, gradient_clip_max_norm: 12.0}
  sample_schedule: immutable_materialized_jsonl_shared_byte_for_byte_across_arms
  tier_transition_hashes: [parent_checkpoint_sha256, data_sha256, sample_schedule_sha256, scheduler_contract_sha256, global_update]
  full_state_checkpoint:
    atomic_write: temporary_file_fsync_then_rename
    required_fields: [model_state, optimizer_state, scheduler_state, amp_scaler_state_or_explicit_null, global_update, sample_schedule_cursor, sampler_state, python_rng_state, numpy_rng_state, torch_cpu_rng_state, torch_cuda_rng_states, arm_id, tier, parent_checkpoint_sha256, protocol_sha256, censorship_manifest_sha256, sample_schedule_sha256]
    resume_test: compare_uninterrupted_10_updates_with_new_process_5_plus_5
    resume_acceptance: exact_global_update_sample_order_parameters_logits_and_loss_trace
cohorts:
  development: val80
  internal_replication: val120
  continuity: val200
  pre_t4_denied: [val120, val200]
  independent_confirmation: requires_externally_unseen_or_custodied_data
gates:
  precision_each_rule_min: 0.80
  recall_each_rule_min: 0.30
  full_minus_text_only_recall_min: 0.10
  pilot_hidden_recall_delta_min_exclusive: 0.0
  certified_fp_relative_delta_max_exclusive: 0.10
  decision_hidden_recall_delta_each_rule_min: 0.05
  known_positive_recall_delta_min: -0.02
  val80_dice_delta_min: -0.001
bootstrap:
  draws: 10000
  seed: 20260731
  cluster_unit: case
hardware:
  mode: docker
  image_tag: rexgroundingct-voxtell:cu126
  local_image_id: sha256:8ff421d05fbf6044553ba987d065a4d6fdaaaab8e2913272e620d08c4c286e0f
  preflight_policy: docker_inspect_image_id_must_equal_local_image_id
  expected_gpu_count: 4
