      gpu_count: 0
    timeout_seconds: 14400
    retry:
      max_attempts: 3
      backoff_seconds: [60, 300]
      retryable_classes: [transient_io]
    stop_conditions: [patient_leakage, hidden_label_feature_leakage, metric_definition_mismatch]
    acceptance_checks:
      - Every censorship rule reaches precision at least 0.80 and recall at least 0.30.
      - Every rule outperforms base-confidence recall at the same precision.
      - Full features exceed text-only recall at 80% precision by at least 0.10.
      - For every outer fold, calibration uses only other-fold opaque overlap targets; held-out targets are evaluated once and never tune thresholds.
      - Logs prove that hidden geometry, size, location, and mask hashes never cross the evaluator boundary.
      - A failed diagnostic skips training and closes no_go.
  - id: t1_resume_smoke
    kind: smoke
    execution_mode: command
    needs: [crossfit_diagnostic]
    required: false
    description: Run ten train-only matched updates for background BCE, unknown-ignore, and nnPU and prove exact new-process full-state resume.
    command:
