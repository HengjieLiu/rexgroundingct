      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_040_censored_label_tri_state/run_v1/completion/validate_locked_inputs.json
    inputs: [locked_lineage_manifest, official_train_metadata, anatomical_cot]
    outputs: [input_validation_report]
    completion:
