schema_version: "1.0"
id: asd_040_censored_label_tri_state
title: Synthetic Censorship and Tri-State Positive-Unlabeled Training
plan_revision: 2
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 6
idea: >-
  Simulate annotation censorship by hiding one connected released-mask entity
  at a time, isolate its geometry in an evaluator, use only other-fold opaque
  overlap targets for cross-fitted diagnostic calibration, and compare
  background BCE, unknown-ignore, and non-negative PU objectives.
problem: >-
  ReXGroundingCT records at most a few representative instances. Standard
  background losses and component labels can punish plausible unannotated
  disease, so apparent false-positive suppression may actually erase valid
  multifocal evidence.
novelty_vs_report: >-
  The report identifies partial labels but does not establish a controlled
  recovery benchmark. This plan creates four patient-separated censorship
  mechanisms, prevents hidden-label leakage by process boundary, and requires
  performance under every censorship rule before real training changes.
hypotheses:
  primary: >-
    A cross-fitted tri-state/nnPU policy will recover at least 30% of hidden
    recorded entities at at least 80% precision under each censorship rule and
    will improve hidden-entity recall without a 10% certified-FP increase.
  null: >-
    Persistence, stability, prompt margin, and image evidence do not improve
    hidden-entity recovery over baseline confidence when evaluated without
    hidden-label leakage.
goals:
  - Measure recoverability of deliberately censored recorded entities.
  - Compare unsafe BCE, unknown-ignore, nnPU, and gated pseudo-positive policies.
  - Freeze a reusable tri-state policy with calibrated uncertainty.
  - Produce evidence ASD-060 can consume without assuming a positive result.
non_goals:
  - Claim that released masks are exhaustive.
  - Use hidden masks or val120 labels in final training.
  - Treat same-finding unlabeled tissue as certified background.
  - Train an independent deployable binary component selector.
evidence_references:
  - source: experiments_aiselfdrive/ReXGroundingCT_Technical_Report_2026-07-30.md
    sections: ["3.3", "7.3", "8.1", "13.3", "13.5", "14"]
    availability: historical_only
  - source: /data/hengjie/datasets/rexgroundingct/MICCAI_challenge_dataset.json
    availability: verified_local
  - source: /data/hengjie/datasets/rexgroundingct/anatomical_cot.json
    availability: verified_local
  - source: asd_000_evidence_lock_error_atlas
    artifact_ids:
      - locked_lineage_manifest
      - val80_manifest
      - val120_manifest
      - val200_manifest
      - prompt_ontology
    availability: missing
lineage:
  parent_checkpoint: /mnt/shengdata1/hengjie/experiments/rexgroundingct/009_voxtell_s3_attention_coupling_ablation/runs/exp009_s3_attention_20260727T081747Z/baseline_cont100/model_epoch100/fold_0/checkpoint_final.pth
  parent_checkpoint_sha256: 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf
  optimizer_restore: false
  initialization: weights_only_for_matched_segmentation_arms
  preprocessing_class: cached-equivalent
  normalization: locked_parent_per_volume_zscore
  prompt_form: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/prompt_form
  inference_window: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/inference_window
  threshold_policy: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/threshold_policy
  postprocessing: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json#/evaluation_contract/postprocessing
  comparability_rule: >-
    Candidate features and segmentation arms share frozen lineage, materialized
    schedules, cohort manifests, and evaluation policy.
  hidden_label_calibration: >-
    Hidden geometry stays in the isolated evaluator. For each outer fold, only
    opaque candidate-overlap targets from the other four folds may fit the
    diagnostic calibrator and its 80%-precision threshold. Held-out-fold targets
    are scoring-only. No hidden geometry, size, or location crosses the boundary,
    and the aggregate out-of-fold policy freezes before segmentation training.
data:
  censorship_source: official_rexgroundingct_train_only
  entity_extraction:
    source: Released finding mask in native CT geometry.
    rule: 26-connected components of voxels greater than zero; discard components smaller than 8 voxels and record every discard.
    canonical_order: Descending voxel count, then ascending physical RAS centroid z, y, x, then component voxel-index digest.
    identity: SHA-256 of case name, finding index, and component voxel-index digest.
    geometry_gate: CT-matching shape, finite affine, and matching axis codes are mandatory.
  eligibility:
    minimum_recorded_entities_per_finding: 2
    minimum_cases: 50
    minimum_trials: 100
    patient_key: ct_filename_patient_prefix
  censorship_rules:
    volume_priority:
      hidden_entity: smallest_voxel_count
      tie_break: ascending_entity_label
    centrality_priority:
      hidden_entity: largest_physical_distance_from_lung_or_body_centroid
      tie_break: ascending_entity_label
    report_order:
      hidden_entity: last_canonical_entity
      interpretation: annotation_order_proxy_only
      caveat: Entity-level clinical report order is unavailable and must never be claimed.
    seeded_random:
      hidden_entity: deterministic_uniform_choice
      seed: 20260731
  cross_fitting:
    folds: 5
    unit: patient
    assignment: sha256_patient_id_mod_5
    inner_calibration: Other-fold opaque overlap targets only; same-fold fitting and held-out threshold tuning are prohibited.
  development_cohort:
    id: val80
    manifest: experiments_aiselfdrive/shared/manifests/val80_development_seed20260731.json
    access: after_crossfit_policy_frozen
    allowed_stages: [decision_t3]
  internal_replication_cohort:
    id: val120
    manifest: experiments_aiselfdrive/shared/manifests/val120_internal_replication_seed20260731.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
    evidence_role: historically_exposed_internal_replication_not_independent_confirmation
  continuity_cohort:
    id: val200
    manifest: configs/evaluation/rexgroundingct_val200_seed20260723.json
    access: prohibited_until_t4_promotion
    allowed_stages: [confirm_t4]
  supervision_states:
    known_positive: retained released entity voxels after censorship
    certified_negative: >-
      Synthetic decoy components placed wholly in verified zero-valued
      acquisition padding outside the physical patient-body mask, disjoint from
      every released finding mask; these are safety controls, not inferred
      disease negatives.
    unknown: >-
      The deliberately hidden entity, all unlabeled compatible tissue, and all
      candidates not meeting the padding certificate.
    evaluation_hidden_positive: >-
      Hidden mask geometry is evaluator-only. The evaluator may emit opaque
      other-fold overlap targets for diagnostic calibration; held-out targets
      are scoring-only. Geometry never enters features, sampling, or loss.
  label_precedence: [known_positive, certified_negative, unknown]
  leakage_controls:
    - Hidden masks are serialized to an evaluator-only directory with a separate manifest.
    - Training manifests contain opaque trial IDs and unknown flags but no hidden coordinates, boxes, volumes, or geometry-derived hashes.
    - Feature extraction runs with the evaluator-only mount absent.
    - val120 and val200 paths are rejected before confirm_t4.
method:
  candidate_generation:
    thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
    connectivity: 26
    parent_model: lineage.parent_checkpoint with lineage.parent_checkpoint_sha256
  frozen_features:
    - base_probability_max
    - base_probability_mean_top_1_percent
    - threshold_persistence_count
    - augmentation_stability
    - paraphrase_stability
    - correct_minus_counterfactual_prompt_margin
    - native_resolution_local_evidence
    - cot_box_compatibility_with_missing_indicator
    - component_volume_and_surface_geometry
  diagnostic_model:
    architecture: mlp
    hidden_units: 128
    hidden_layers: 2
    activation: relu
    dropout: 0.10
    optimizer: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
    maximum_epochs: 100
    calibration: per_fold_threshold_for_precision_at_least_0.80
    calibration_target_contract: Other-fold evaluator overlap targets only; held-out fold labels are used once for scoring.
  policies:
    - id: background_bce
      unknown_action: negative
      purpose: unsafe_reference_only
    - id: unknown_ignore
      unknown_action: zero_loss
    - id: nnpu
      unknown_action: non_negative_positive_unlabeled_risk
      class_prior: estimated_training_fold_only
    - id: pseudo_positive
      unknown_action: promote_only_crossfit_score_above_calibrated_threshold
      enabled_only_after_diagnostic_go: true
  controls:
    - base_confidence_only
    - anatomy_or_cot_compatibility_only
    - persistence_only
    - counterfactual_margin_only
    - shuffled_prompt_features
    - text_only_shortcut_classifier
  compute_ladder:
    diagnostic: five_fold_frozen_feature_crossfit
    smoke_t1_updates: 10
    pilot_t2_updates: 500
    decision_t3_updates: 2000
    confirm_t4_updates: 10000
    update_semantics: cumulative_global_update_barriers
    scheduler_contract: One immutable 10,000-update polynomial horizon; every arm resumes its own prior-barrier full scheduler state without restart, warmup replay, or horizon mutation.
    t4_matched_start: Selected-policy treatment and disabled-parent-loss control each resume their own matched 2,000-update T3 full state; a fresh control is prohibited.
    maximum_parallel_single_gpu_arms: 4
    evaluation_barrier: true
resources:
  hardware_profile: experiments_aiselfdrive/shared/hardware_profile.yaml
  execution_environment: docker
  image: rexgroundingct-voxtell:cu126
  local_image_id: sha256:8ff421d05fbf6044553ba987d065a4d6fdaaaab8e2913272e620d08c4c286e0f
  gpu_model: NVIDIA RTX 6000 Ada Generation
  gpu_count_available: 4
  minimum_free_gib_training: 36
  multi_gpu_ddp: false
  slurm: prohibited
  runtime_root: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_040_censored_label_tri_state/run_v1
stage_execution_contract:
  resource_limits:
    cpu_cores_hardware_max: 128
    gpu_count_hardware_max: 4
    gpu_count_per_arm_max: 1
    maximum_concurrent_arms: 4
    inference_free_memory_gib_min: 32
    training_free_memory_gib_min: 36
    multi_gpu_ddp: prohibited
  evidence:
    applies_to: every_stage
    object_path: metrics.resources
    required_fields: [gpu_hours, cpu_hours, storage_gib]
    semantics:
      gpu_hours: incremental_stage_gpu_hours
      cpu_hours: incremental_stage_cpu_hours
      storage_gib: cumulative_experiment_runtime_tree_high_water_at_stage_completion
    validation: All values are finite and nonnegative; storage_gib is measured over the experiment runtime tree and never reported as a stage delta.
  controller_container_identity:
    required_environment: [REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL]
    required_labels:
      lease: rexgroundingct.aiselfdrive.lease=REXGROUNDINGCT_AISELFDRIVE_LEASE_ID
      experiment: rexgroundingct.aiselfdrive.experiment=REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID
    rule: Every nested docker run consumes controller-provided values and applies both exact labels; container names and lease values are never hard-coded.
stages:
  - id: implement_censorship_pipeline
    kind: implementation
    execution_mode: agent
    needs: []
    required: true
    description: Implement isolated censorship, evaluator separation, cross-fitting, PU losses, and tests.
    instructions:
      - Read this plan, configs/protocol.yaml, dependency manifests, and applicable README files.
      - Implement only inside this experiment's scripts, src, and tests directories.
      - Create separate training and evaluator-only manifests; training artifacts must contain no hidden geometry, volume, or mask hash.
      - Implement all four deterministic censorship rules and patient-hash fold assignment exactly.
      - Implement native-geometry 26-connected entity extraction, canonical ordering, minimum eight-voxel filtering, and explicit annotation-order-proxy naming exactly as declared.
      - Keep hidden geometry evaluator-only; expose only other-fold opaque overlap targets to the isolated diagnostic calibrator and never to segmentation training.
      - Make unknown-ignore and nnPU losses explicit; background_bce is a labeled unsafe control and cannot be selected.
      - Add a pre-T4 cohort guard and atomic JSON completion records.
      - Consume controller env REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, and REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL; label every nested container rexgroundingct.aiselfdrive.lease with the lease ID and rexgroundingct.aiselfdrive.experiment with the experiment ID, and never hard-code container names or lease values.
      - Emit metrics.resources in every stage evidence with incremental gpu_hours, incremental cpu_hours, and cumulative experiment runtime-tree high-water storage_gib.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_040_censored_label_tri_state/scripts
      - experiments_aiselfdrive/experiments/asd_040_censored_label_tri_state/src
      - experiments_aiselfdrive/experiments/asd_040_censored_label_tri_state/tests
      - experiments_aiselfdrive/experiments/asd_040_censored_label_tri_state/results/implementation_evidence.json
    inputs: [experiment_plan, protocol_config, locked_lineage_manifest]
    outputs: [tri_state_source_package, tri_state_test_suite]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_040_censored_label_tri_state/results/implementation_evidence.json
      require_git_diff_within_allowed_paths: true
    resources:
      cpu_cores: 8
      gpu_count: 0
    timeout_seconds: 14400
    retry:
      max_attempts: 1
      backoff_seconds: []
      retryable_classes: []
    stop_conditions: [write_scope_violation, unresolved_dependency_interface]
    acceptance_checks:
      - Tests prove hidden-label process separation and patient-separated folds.
      - All four censorship rules are deterministic.
      - Unknown samples have zero negative loss outside the explicit unsafe control.
