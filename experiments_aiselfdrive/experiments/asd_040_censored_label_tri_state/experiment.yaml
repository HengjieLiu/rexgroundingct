  artifact_manifest: experiments_aiselfdrive/experiments/asd_040_censored_label_tri_state/artifacts/manifest.json
  result: experiments_aiselfdrive/experiments/asd_040_censored_label_tri_state/results/result.json
budget:
  gpu_hours_max: 50
  cpu_hours_max: 2000
  durable_storage_gib_max: 1200
