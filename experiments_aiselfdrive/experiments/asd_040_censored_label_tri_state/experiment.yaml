    stop_conditions: [evidence_hash_mismatch, undecided_required_claim, hidden_label_exposure]
    acceptance_checks:
      - Negative scientific evidence is no_go rather than failed.
      - Every rule is reported separately and every claim cites evidence.
      - No hidden mask or derived individual geometry enters workspace results.
evaluation:
  bootstrap:
    seed: 20260731
    draws: 10000
    units: [entity, finding, case_cluster]
  diagnostic_metrics:
    - hidden_entity_precision
    - hidden_entity_recall
    - recall_at_80_percent_precision
    - base_confidence_delta
    - text_only_shortcut_delta
  training_metrics:
    - hidden_entity_recall_delta
    - certified_fp_relative_delta
    - known_positive_recall_delta
    - paired_dice_delta
    - empty_prediction_delta
  gates:
    eligibility:
      - eligible_cases >= 50
      - hidden_trials >= 100
    diagnostic_go:
      - each_rule_precision >= 0.80
      - each_rule_recall >= 0.30
      - each_rule_recall > matched_base_confidence_recall
      - full_minus_text_only_recall_at_80_precision >= 0.10
    pilot_go:
      - hidden_entity_recall_delta > 0
      - certified_fp_relative_delta < 0.10
    decision_go:
      - each_rule_hidden_recall_delta >= 0.05
      - certified_fp_relative_delta < 0.10
      - known_positive_recall_delta >= -0.02
      - val80_paired_dice_delta >= -0.001
    internal_replication_go:
      - val120_case_clustered_safety_ci_lower >= -0.001
promotion_contract:
  artifact_id: promotion_record
  path: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/promotions/asd_040_censored_label_tri_state.json
  exact_producer: experimentctl promote
  required_fields: [schema_version, experiment_id, source, portfolio_sha256, plan_sha256, t3_evidence_sha256, rank, promoted_at, matched_control_required, val120_access_authorized]
  validation: Require matching experiment and plan, source experimentctl promote, matched_control_required true, val120_access_authorized true, and SHA-256 equality with controller event and state.
gate_ids: [lineage.hidden_label_calibration]
paths:
