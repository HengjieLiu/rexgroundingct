schema_version: "1.0"
id: asd_000_evidence_lock_error_atlas
title: Evidence lock, honest cohort roles, verified logits, and spatial error atlas
plan_revision: 2
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T23:30:00Z"
priority: 1
idea: >-
  Establish one locally reproducible Exp009 evaluation lineage by recomputing
  Dice and hits from stored prediction masks plus released ground truth, then
  quantify prompt-specific spatial errors before new training consumes them.
problem: >-
  The historical report mixes unavailable remote artifacts and incomparable
  lineages. Revision 1 also mistook evaluator-summary verification for metric
  reproduction and treated an already exposed val120 complement as an
  untouched confirmatory cohort. Both errors must be corrected explicitly.
novelty_vs_report: >-
  This is a provenance and diagnostic experiment, not a model. It locks local
  2560-dimensional evidence, recomputes the canonical baseline independently
  of its summary JSON, requires verified val80 logits, freezes a conservative
  tri-state anatomy taxonomy, and separates internal replication from truly
  independent confirmation.
hypotheses:
  primary: >-
    The stored Exp009 masks reproduce the recorded val200 Dice and exact hit
    count when evaluated directly against released GT, and explicit spatial
    prompts expose measurable off-location false-positive structure on val80.
  null: >-
    Direct prediction/GT recomputation does not match the recorded baseline,
    verified val80 logits cannot be established, or prompt/anatomy evidence is
    too ambiguous to support a safe spatial taxonomy.
goals:
  - Lock all locally executable evidence with stable SHA-256 provenance.
  - Recompute Exp009 standard Dice and hits from stored prediction and GT arrays.
  - Fix val80 as development data and val120 as historically exposed internal replication only.
  - Require a complete, geometry-verified val80 baseline-logit manifest for GO and downstream use.
  - Freeze a conservative prompt-location ontology and tri-state supervision policy.
  - Produce a deterministic val80 error atlas and machine-readable downstream contracts.
non_goals:
  - Train, fine-tune, or select a new segmentation model.
  - Treat report summaries or evaluator summaries as substitutes for prediction/GT recomputation.
  - Describe val120 as untouched, blinded, independently confirmatory, or external.
  - Make an independent performance-confirmation claim without new externally unseen, custodied data.
  - Convert anatomically compatible unlabeled tissue into negative supervision.
  - Modify the technical report or any historical evidence artifact.
