schema_version: "1.0"
id: asd_000_evidence_lock_error_atlas
title: Evidence lock, cohort seal, prompt ontology, and spatial error atlas
plan_revision: 1
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 1
idea: >-
  Establish one locally reproducible Exp009 evaluation lineage and quantify
  prompt-specific spatial errors before any new model or training signal is
  allowed to consume validation evidence.
problem: >-
  The historical report mixes unavailable remote artifacts and incomparable
  lineages. Local work needs immutable checkpoint, data, prompt, evaluator,
  threshold, preprocessing, post-processing, cohort, and geometry contracts.
novelty_vs_report: >-
  This experiment does not propose a model. It closes the report's unresolved
  canonical-evaluation, saved-logit, prompt-location-FP, partial-label, and
  orientation gaps with machine-verifiable local provenance.
hypotheses:
  primary: >-
    The local Exp009 baseline can be reproduced exactly enough to support
    paired val80 diagnostics, and explicit spatial prompts expose measurable
    off-location false-positive structure under a conservative tri-state
    labeling policy.
  null: >-
    The local lineage cannot reproduce its recorded baseline or the available
    anatomy and prompt evidence cannot support a stable spatial error taxonomy.
goals:
  - Lock all locally executable evidence with SHA-256 hashes and availability labels.
  - Reproduce the Exp009 standard baseline on fixed val200.
  - Adopt the accepted category-aware val80 and seal its val120 complement.
  - Freeze a conservative prompt-location ontology and tri-state supervision policy.
  - Produce a val80 error atlas and machine-readable downstream manifests.
non_goals:
  - Train, fine-tune, or select a new segmentation model.
  - Treat the report's remote checkpoints, Slurm jobs, H100/H200 runs, or 2048-dimensional text claims as local provenance.
  - Inspect val120 predictions, labels, metrics, or error examples before a declared T4 stage.
  - Convert anatomically compatible unlabeled tissue into negative supervision.
  - Rewrite, normalize, or otherwise modify the technical report.
