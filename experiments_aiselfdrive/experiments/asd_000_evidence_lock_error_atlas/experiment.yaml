  supervision_policy:
    labels: [known_positive, certified_negative, unknown]
    known_positive: Released mask voxels and components only.
    certified_negative: Regions incompatible with a high-confidence explicit prompt and verified anatomy.
    unknown: All compatible unlabeled regions and every ambiguous or diffuse prompt region.
    forbidden: Treating unknown or compatible unlabeled regions as globally empty.
method:
  protocol_config: experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/configs/protocol.yaml
  reproduction:
    dice_tolerance_absolute: 0.000005
    expected_dice: 0.3398392601031359
    expected_hits: 288
    expected_findings: 381
    threshold: 0.5
    hit_threshold: 0.1
    prompt_form: original_finding_text
    preprocessing: unchanged_exp009_native_192_per_volume_zscore
    postprocessing: raw_thresholded_mask_without_new_filter
  prompt_ontology:
    parser_version: asd_prompt_ontology_v1
    groups:
      - exact_lobe
      - laterality_only
      - apical_or_basal
      - central_or_peripheral
      - subpleural
      - hilar
      - peribronchial
      - bilateral_or_multifocal
      - diffuse
      - unknown
    confidence_policy: >-
      Emit a certified spatial target only for unambiguous literal matches;
      ambiguity, negation, conflicting spans, and broad/diffuse language route
      to unknown without a restrictive target.
  error_atlas:
    cohort: val80
    thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
    primary_threshold: 0.5
    component_connectivity: 26
    physical_units: millimeters
    reports:
      - dice_and_hit
      - empty_mask_rate
      - precision_recall_and_predicted_volume
      - prompt_off_location_fp_voxels_and_components
      - ipsilateral_nontarget_contralateral_and_outside_lung_fp
      - anatomy_compliance
      - detached_component_counts
      - candidate_recall
      - threshold_curves_when_verified_logits_exist
    uncertainty:
      bootstrap_draws: 10000
      bootstrap_seed: 20260731
      cluster_unit: case
  logit_policy:
    sideexp002_audit: side_experiments/sideexp002_multimodel_ensemble_selection/outputs/logit_export_audit.json
    observed_candidate_status: exp009_baseline_e100_not_started_on_2026_07_31
    reuse_requires:
      - immutable candidate manifest hash
      - complete 200-case geometry
      - finite values
      - verified array hashes
      - same-pass threshold-mask equivalence
    fallback: >-
      Export baseline val80 logits through the local Docker inference path only
      after GPU preflight, bounded to two GPU-hours. Lack of logits is recorded
      explicitly and cannot be disguised as a threshold sweep.
resources:
  execution_class: CPU_first_with_optional_single_gpu_logit_export
  cpu_threads_max: 32
  ram_gib_max: 128
  gpu_count_max: 1
  docker_image: rexgroundingct-voxtell:cu126
  gpu_preflight_ref: experiments_aiselfdrive/shared/hardware_profile.yaml
  gpu_hours_max: 2
  training: prohibited
stages:
  - id: implement_evidence_lock_pipeline
    kind: implementation
    execution_mode: agent
    needs: []
    required: true
    description: Implement the bounded evidence, cohort, parser, geometry, and atlas tooling.
    instructions: >-
      Implement lock_evidence.py, cohorts.py, prompt_ontology.py, error_atlas.py,
      one run_stage.py CLI, and focused unit tests. Read protocol.yaml as the
      only experiment configuration. Use atomic JSON/CSV writes, SHA-256
      streaming, deterministic sorted traversal, physical affine coordinates,
      and no writes outside the listed files and declared runtime/shared
      outputs. The parser must default to unknown and the atlas must never call
      compatible unlabeled voxels negative. The CLI must expose phases lineage,
      cohorts, logits, atlas, and closeout. It must reject val120 metric access.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/src/lock_evidence.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/src/cohorts.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/src/prompt_ontology.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/src/error_atlas.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/scripts/run_stage.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_lock_evidence.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_cohorts.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_prompt_ontology.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_error_atlas.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/results/implement_evidence_lock_pipeline.json
    inputs:
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/configs/protocol.yaml
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/experiment.yaml
    outputs:
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/scripts/run_stage.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_lock_evidence.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_cohorts.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_prompt_ontology.py
      - experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests/test_error_atlas.py
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/results/implement_evidence_lock_pipeline.json
      predicate: All declared modules compile and all experiment-local tests pass.
    resources:
      gpu_count: 0
      cpu_threads: 8
    timeout_seconds: 7200
    retry:
      class: non_retryable_agent_implementation
      max_attempts: 1
    stop_conditions:
      - Any requested write falls outside allowed_write_paths.
      - A test requires reading val120 masks, predictions, or metrics.
    acceptance_checks:
      - PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/tests -p test_*.py
      - python -m py_compile experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/src/*.py experiments_aiselfdrive/experiments/asd_000_evidence_lock_error_atlas/scripts/*.py
  - id: lock_local_lineage
    kind: evidence
    execution_mode: command
    needs: [implement_evidence_lock_pipeline]
    required: true
    description: Hash local inputs and reproduce the canonical Exp009 baseline.
