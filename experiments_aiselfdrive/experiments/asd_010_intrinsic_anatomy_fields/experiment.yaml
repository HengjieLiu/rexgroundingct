    acceptance_checks:
      - Correct-field treatment and no-coupling control each have a distinct verified full-state checkpoint at cumulative global update 2000 with identical parent, data, sample-schedule, and scheduler-contract hashes.
      - Threshold-matched and predicted-volume-matched effects retain the same direction.
      - Explicit-modifier or aggregate Dice gate passes with GT retention and hit safety.
      - Val80 paired finding and case-clustered intervals are recorded without val120 access.
