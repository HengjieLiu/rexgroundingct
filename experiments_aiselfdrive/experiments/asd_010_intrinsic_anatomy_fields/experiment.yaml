schema_version: "1.0"
id: asd_010_intrinsic_anatomy_fields
title: Continuous patient-specific thoracic fields with bounded late logit coupling
plan_revision: 2
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 3
idea: >-
  Convert verified lung/lobe anatomy into continuous physical coordinate fields
  and use prompt-derived spatial energy only through an identity-initialized,
  bounded final-logit residual.
problem: >-
  Hard lobe gates remove true lesions, scalar anatomy inputs are ignored, and
  direct anatomy-query addition collapses foreground. A safe intervention must
  preserve base logits exactly at zero, express graded spatial compatibility,
  and fall back to identity under language or anatomy uncertainty.
novelty_vs_report: >-
  The report tested discrete masks, scalar channels, semantic clipping, and
  unbounded query addition. This plan uses continuous physical fields,
  out-of-fold retention-constrained energy selection, exact bypass semantics,
  and correct/swap/invert/permutation causal controls.
hypotheses:
  primary: >-
    Correct continuous anatomy fields reduce val80 prompt-off-location false
    positives by at least 15 percent or detached off-location components by at
    least 10 percent at 99 percent GT retention, and bounded learned coupling
    improves explicit-modifier Dice without aggregate harm.
  null: >-
    Correct fields do not outperform zero, discrete, swapped, inverted,
    permuted, and randomized controls under the same retention and calibration
    constraints.
goals:
  - Build compact 3-mm physical thoracic fields from the immutable anatomy cache.
  - Establish a no-training out-of-fold diagnostic before model changes.
  - Implement an exact-zero, bounded late-logit coupling with causal controls.
  - Run matched T1, T2, and T3 comparisons and permit T4 only through portfolio promotion.
non_goals:
  - Delete predictions with hard lobe clipping.
  - Append scalar lobe labels as an unconstrained image channel.
  - Add anatomy vectors to the text query or decoder representation.
  - Treat hilar or airway relations as reliable without a train-wide verified source.
  - Inspect val120 before a controller-promoted T4 internal-replication stage.
