  gpu_count_max: 4
  gpu_memory_free_gib_min_training: 36
  gpu_memory_free_gib_min_inference: 32
  docker_image: rexgroundingct-voxtell:cu126
  docker_local_image_id: sha256:8ff421d05fbf6044553ba987d065a4d6fdaaaab8e2913272e620d08c4c286e0f
  use_multi_gpu_ddp: false
  gpu_preflight_ref: experiments_aiselfdrive/shared/hardware_profile.yaml
  cpu_threads_max: 32
  ram_gib_max: 192
stage_execution_contract:
  resource_limits:
    cpu_cores_hardware_max: 128
    gpu_count_hardware_max: 4
    gpu_count_per_arm_max: 1
    maximum_concurrent_arms: 4
    inference_free_memory_gib_min: 32
    training_free_memory_gib_min: 36
    multi_gpu_ddp: prohibited
  evidence:
    applies_to: every_stage
    object_path: metrics.resources
    required_fields: [gpu_hours, cpu_hours, storage_gib]
    semantics:
      gpu_hours: incremental_stage_gpu_hours
      cpu_hours: incremental_stage_cpu_hours
      storage_gib: cumulative_experiment_runtime_tree_high_water_at_stage_completion
    validation: All values are finite and nonnegative; storage_gib is measured over the experiment runtime tree and never reported as a stage delta.
  controller_container_identity:
    required_environment: [REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID, REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL]
    required_labels:
      lease: rexgroundingct.aiselfdrive.lease=REXGROUNDINGCT_AISELFDRIVE_LEASE_ID
      experiment: rexgroundingct.aiselfdrive.experiment=REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID
    rule: Every nested docker run consumes controller-provided values and applies both exact labels; container names and lease values are never hard-coded.
stages:
  - id: implement_anatomy_field_pipeline
    kind: implementation
    execution_mode: agent
    needs: []
    required: true
    description: Implement field construction, prompt energy, bounded coupling, matched training wrappers, evaluation, and tests.
    instructions: >-
      Create fields.py, routing.py, coupling.py, a run_stage.py CLI, and focused
      tests. The CLI must expose build_val80_fields, diagnostic, build_trainval_fields,
      preflight, t1, t2, t3, t4, and closeout. The coupling's raw_alpha==0 path must return
      the exact input tensor without arithmetic. Field grids must use physical
      affines and fixed 3-mm RAS geometry. Hilar/airway signals are exploratory
      val-only and never enter training. Training must snapshot the shared
      schedule, preserve full resume state, execute tier barriers, and reject
      val120 access outside t4. Resolve the verified ASD-000 logit-source
      projection's manifest_path, hash that resolved manifest, require equality
      with manifest_sha256, and consume only files declared by it. Do not
      modify existing repository code. Consume controller env
      REXGROUNDINGCT_AISELFDRIVE_EXPERIMENT_ID,
      REXGROUNDINGCT_AISELFDRIVE_LEASE_ID, and
      REXGROUNDINGCT_AISELFDRIVE_DOCKER_LABEL; label every nested container
      rexgroundingct.aiselfdrive.lease with the lease ID and
      rexgroundingct.aiselfdrive.experiment with the experiment ID, and never
      hard-code container names or lease values.
      Every stage evidence must emit metrics.resources with incremental
      gpu_hours, incremental cpu_hours, and cumulative experiment runtime-tree
      high-water storage_gib.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/src/fields.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/src/routing.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/src/coupling.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/run_stage.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/tests/test_fields.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/tests/test_routing.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/tests/test_coupling.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/tests/test_leakage_and_controls.py
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/implement_anatomy_field_pipeline.json
    inputs: [protocol_config, locked_lineage, trainval_anatomy_manifest, val80_manifest, prompt_ontology, error_atlas_contract]
    outputs: [anatomy_field_source_package, anatomy_field_test_suite]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/implement_anatomy_field_pipeline.json
      predicate: Modules compile; unit tests pass; exact zero identity and val120 access denial are proven.
    resources:
      gpu_count: 0
      cpu_threads: 8
    timeout_seconds: 10800
    retry:
      class: non_retryable_agent_implementation
      max_attempts: 1
    stop_conditions:
      - Any requested write is outside allowed_write_paths.
      - Zero coupling performs arithmetic on or copies through a changed dtype.
      - Unsupported prompt groups receive nonzero energy.
    acceptance_checks:
      - PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/tests -p test_*.py
      - python -m py_compile experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/src/*.py experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/*.py
  - id: build_val80_field_cache
    kind: data_preparation
    execution_mode: command
    needs: [implement_anatomy_field_pipeline]
    required: true
    description: Build and verify compact physical fields for val80 only.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/configs/protocol.yaml, --phase, build_val80_fields]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/val80_field_cache.json
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_010_intrinsic_anatomy_fields/fields/val80
    inputs: [val80_manifest, trainval_anatomy_manifest]
    outputs: [val80_field_cache, val80_field_cache_report]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/val80_field_cache.json
      predicate: All 80 cases have finite, correctly oriented, invertibly mapped field grids.
    resources: {gpu_count: 0, cpu_threads: 32, ram_gib_max: 128}
    timeout_seconds: 21600
    retry: {class: transient, max_attempts: 3, backoff_seconds: [60, 300]}
    stop_conditions:
      - Geometry, orientation, label, or field-range validation fails.
      - A val120 case is opened.
    acceptance_checks:
      - 80 of 80 cases verify.
      - Field-to-native-to-field round-trip landmarks are within 1.5 mm.
      - Left-right, superior-inferior, and lobe fixtures pass.
  - id: run_retention_constrained_diagnostic
    kind: diagnostic
    execution_mode: command
    needs: [build_val80_field_cache]
    required: true
    description: Run five-fold out-of-fold energy and causal-control diagnostics on val80.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/configs/protocol.yaml, --phase, diagnostic]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/diagnostic.json
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/diagnostic.csv
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/diagnostic_summary.md
    inputs: [val80_field_cache, revision_2_logit_source_projection, prompt_ontology, error_atlas_contract]
    outputs: [diagnostic, diagnostic_table, diagnostic_summary]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/diagnostic.json
      predicate: Held-out-fold metrics and all causal controls are complete and the diagnostic gate is decided.
    resources: {gpu_count: 0, cpu_threads: 32, ram_gib_max: 128}
    timeout_seconds: 21600
    retry: {class: evaluation, max_attempts: 3, preserve_verified_cases: true}
    stop_conditions:
      - Verified baseline val80 logits are unavailable.
      - GT retention falls below 99 percent for the selected correct-field setting.
      - Correct fields do not outperform all swap, inversion, permutation, and random controls.
    acceptance_checks:
      - Folds are case-disjoint and each finding is evaluated exactly once out of fold.
      - The projection and its resolved manifest_path are both hashed, and the resolved hash equals manifest_sha256 before any logit is opened.
      - Correct-field GT retention is at least 99 percent.
      - Correct fields reduce off-location FP by at least 15 percent or detached off-location components by at least 10 percent.
  - id: build_trainval_field_cache
    kind: data_preparation
    execution_mode: command
    needs: [run_retention_constrained_diagnostic]
    required: true
    description: Build compact fields for all train/validation cases only after the diagnostic GO.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/configs/protocol.yaml, --phase, build_trainval_fields]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/trainval_field_cache.json
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_010_intrinsic_anatomy_fields/fields/trainval
    inputs: [diagnostic, trainval_anatomy_manifest]
    outputs: [trainval_field_cache, trainval_field_cache_report]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/trainval_field_cache.json
      predicate: 3,192 field records verify against source anatomy and physical geometry.
    resources: {gpu_count: 0, cpu_threads: 32, ram_gib_max: 192}
    timeout_seconds: 86400
    retry: {class: transient, max_attempts: 3, backoff_seconds: [60, 300]}
    stop_conditions:
      - Diagnostic outcome is not GO.
      - Any trainval field geometry is invalid.
    acceptance_checks:
      - 3192 of 3192 field records verify.
      - No test or val120 metric data are accessed.
  - id: docker_gpu_preflight
    kind: preflight
    execution_mode: command
    needs: [build_trainval_field_cache]
    required: true
    description: Verify the pinned VoxTell image, four GPUs, parent checkpoint, memory, and one finite identity inference.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/configs/protocol.yaml, --phase, preflight]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/gpu_preflight.json
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_010_intrinsic_anatomy_fields/preflight
    inputs: [parent_checkpoint, trainval_field_cache]
    outputs: [gpu_preflight_report]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/gpu_preflight.json
      predicate: Pinned image, devices, free memory, checkpoint hash/load, and one-case zero-coupling identity inference all pass.
    resources: {gpu_count: 1, gpu_count_per_arm: 1, arm_count: 1, maximum_concurrent_arms: 1, gpu_memory_free_gib_min: 32, cpu_threads: 8, docker_image: rexgroundingct-voxtell:cu126, gpu_hours_max: 0.25}
    timeout_seconds: 3600
    retry: {class: resource_then_transient, max_attempts: 3, resource_wait_timeout_seconds: 21600}
    stop_conditions:
      - Docker image ID, device count/model, free memory, or parent hash differs from the pinned contract.
      - Parent load or one-case inference is non-finite.
    acceptance_checks:
      - Docker inspect image ID equals sha256:8ff421d05fbf6044553ba987d065a4d6fdaaaab8e2913272e620d08c4c286e0f.
      - Docker sees exactly four NVIDIA RTX 6000 Ada Generation GPUs and the selected inference GPU has at least 32 GiB free.
      - Parent checkpoint SHA-256 equals 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf and one-case zero coupling is bitwise identical.
  - id: t1_identity_and_training_smoke
