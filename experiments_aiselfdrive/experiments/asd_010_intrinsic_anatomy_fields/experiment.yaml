    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/configs/protocol.yaml, --phase, t3]
