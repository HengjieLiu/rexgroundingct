      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_010_intrinsic_anatomy_fields/runs
    inputs: [parent_checkpoint, trainval_field_cache, gpu_preflight_report]
    outputs: [t1_checkpoints, t1_report]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/t1.json
      predicate: Exact identity, finite updates, resume, ownership, memory, and one-case inference checks pass.
    resources: {gpu_count: 4, gpu_count_per_arm: 1, arm_count: 4, maximum_concurrent_arms: 4, gpu_memory_free_gib_min_each: 36, cpu_threads: 32, docker_image: rexgroundingct-voxtell:cu126, gpu_hours_per_arm_max: 0.25}
    timeout_seconds: 7200
    retry: {class: training, max_attempts: 2, max_automatic_resumes: 1}
    stop_conditions:
      - Epoch-zero zero-scale logits are not bitwise equal to parent logits.
      - Any arm uses a different schedule or parent hash.
      - Non-finite loss, wrong device, missing resume state, or memory above safe capacity.
    acceptance_checks:
      - Four arms share byte-identical schedule and parent hashes.
      - Zero-control parameter and logit identity pass.
      - Ten updates and one full-state resume complete for every arm.
  - id: t2_500_update_val80
    kind: training_evaluation
    execution_mode: command
    needs: [t1_identity_and_training_smoke]
    required: true
    description: Train four matched arms to 500 updates and evaluate at a synchronous val80 barrier.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/configs/protocol.yaml, --phase, t2]
