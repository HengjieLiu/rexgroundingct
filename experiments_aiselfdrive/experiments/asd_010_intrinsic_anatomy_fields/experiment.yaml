      - experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/t3_metrics.csv
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_010_intrinsic_anatomy_fields/runs
    inputs: [t2_checkpoints]
    outputs: [t3_checkpoints, t3_report, t3_metrics]
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/results/t3.json
      predicate: Val80 gate, calibrated controls, clustered intervals, and measured compute are complete.
      required_fields: [matched_t3_state_hashes, metrics.promotion, metrics.resources]
    resources: {gpu_count: 2, gpu_count_per_arm: 1, arm_count: 2, maximum_concurrent_arms: 2, gpu_memory_free_gib_min_each: 36, cpu_threads: 32, gpu_hours_per_arm_max: 2.5}
