data:
  trainval_anatomy_manifest: experiments_aiselfdrive/shared/manifests/trainval_fast3mm_anatomy_v1.json
  lineage_manifest: experiments_aiselfdrive/shared/manifests/asd000_local_lineage_revision_2.json
  prompt_ontology: experiments_aiselfdrive/shared/manifests/prompt_ontology_v1.json
  error_atlas_contract: experiments_aiselfdrive/shared/manifests/asd000_error_atlas_contract_revision_2.json
  val80_manifest: experiments_aiselfdrive/shared/manifests/val80_development_seed20260731.json
  val120_manifest: experiments_aiselfdrive/shared/manifests/val120_internal_replication_seed20260731.json
  val200_manifest: configs/evaluation/rexgroundingct_val200_seed20260723.json
  val120_access:
    before_t4: prohibited
    allowed_stage: t4_confirmatory_val120_and_val200
  supervision_policy:
    labels: [known_positive, certified_negative, unknown]
    known_positive: Released segmentation only.
    certified_negative: High-confidence prompt-incompatible anatomy after orientation and parser validation.
    unknown: Compatible unlabeled, ambiguous, bilateral, diffuse, hilar, peribronchial, or unsupported regions.
method:
  protocol_config: experiments_aiselfdrive/experiments/asd_010_intrinsic_anatomy_fields/configs/protocol.yaml
  field_grid:
    orientation: RAS
    spacing_mm: [3.0, 3.0, 3.0]
    extent: source_ct_physical_extent
    storage:
      lobe_label: uint8
      side_label: uint8
      craniocaudal_percentile: uint8_linear_0_to_255
      pleural_depth_mm: uint8_clipped_0_to_63
      fissure_distance_mm: uint8_clipped_0_to_63
      centrality: uint8_linear_0_to_255
    interpolation_to_native_patch:
      labels: nearest
      continuous_fields: trilinear
      coordinate_mapping: physical_affine
  field_definitions:
    side_label: Left and right five-lobe unions; zero outside lung.
    lobe_label: Five mutually exclusive TotalSegmentator lobe labels; zero outside lung.
    craniocaudal_percentile: >-
      Within each side-lung, physical RAS superior coordinate normalized from
      the inferior 0th percentile to superior 100th percentile and clipped to
      [0,1].
    pleural_depth_mm: Euclidean physical distance from an interior lung voxel to the union-lung boundary, clipped at 63 mm.
    fissure_distance_mm: Euclidean physical distance to the nearest interface between distinct same-side lobe labels, clipped at 63 mm.
    centrality: Side-specific pleural depth divided by that side's 99th-percentile pleural depth and clipped to [0,1].
    exploratory_only:
      airway_or_hilum_distance: >-
        May be reported on val80 using high-resolution thorax assets, but is
        excluded from gating and training because no matched train-wide source exists.
  prompt_routing:
    exact_lobe: target lobe with a 15-mm graded exterior ramp.
    laterality_only: target side with a 15-mm graded exterior ramp.
    apical: craniocaudal percentile target range [0.66, 1.0].
    basal: craniocaudal percentile target range [0.0, 0.34].
    central: centrality target range [0.60, 1.0].
    peripheral: centrality target range [0.0, 0.40].
    subpleural: pleural depth target range [0, 15] mm.
    identity_groups:
      - bilateral_or_multifocal
      - diffuse
      - hilar
      - peribronchial
      - unknown
      - conflicting_or_negated
    combination: Intersect only compatible same-confidence constraints; any conflict routes the entire finding to identity.
  energy:
    range: [-1.0, 1.0]
    construction: >-
      Average the signed, linearly ramped compatibility of each compatible
      routed constraint, clip to [-1,1], and set zero for identity groups or
      invalid anatomy.
    coupling: z_final = z_base + alpha * tanh(E_anatomy)
    alpha_parameterization: alpha = 2.0 * tanh(raw_alpha)
    initialization: raw_alpha equals 0 and executes an exact base-logit bypass.
  diagnostic:
    cohort: val80
    folds: 5
    fold_assignment: Sort by SHA-256 of the UTF-8 string 20260731 colon case_name, then assign round-robin to folds 0 through 4.
    alpha_candidates: [0.1, 0.25, 0.5, 1.0, 2.0]
    selection: >-
      For each held-out fold, choose the smallest positive alpha on the other
      four folds that maximizes prompt-off-location FP reduction subject to at
      least 99 percent GT retention; aggregate only held-out predictions.
    controls:
      - zero_scale
      - discrete_side_or_lobe_mask
      - correct_continuous_fields
      - left_right_swap
      - superior_inferior_inversion
      - deterministic_lobe_permutation
      - within_case_seeded_field_randomization
  training:
    arms_t1_t2:
      - matched_no_coupling_control
      - correct_continuous_fields
      - left_right_swapped_fields
      - lobe_permuted_fields
    arms_t3_t4:
      - matched_no_coupling_control
      - correct_continuous_fields
    schedule_seed: 20260731
    schedule_materialization: One immutable event JSONL shared byte-for-byte by all arms.
    update_semantics: T1, T2, T3, and T4 are cumulative global-update barriers at 10, 500, 2,000, and 10,000.
    scheduler_contract: One immutable 10,000-update polynomial horizon; each arm resumes its own prior-barrier full scheduler state without restart, warmup replay, or horizon mutation.
    t4_matched_start: Correct-field treatment and no-coupling control each resume their own matched 2,000-update T3 full state; a fresh control is prohibited.
    batch_size: 1
    gradient_accumulation: 1
    world_size_per_arm: 1
    precision: bf16
    optimizer: SGD
    nesterov: true
    momentum: 0.99
    weight_decay: 0.00003
    encoder_lr: 0.00001
    non_encoder_lr: 0.0001
    module_lr: 0.0001
    lr_schedule: polynomial
    poly_power: 0.9
    warmup_updates: 100
    gradient_clip_max_norm: 12.0
    checkpoints: >-
      Atomic full state containing model, optimizer, scheduler, AMP scaler or
      explicit null, global update, sample cursor, sampler, Python, NumPy, CPU
      and CUDA RNG states, arm/tier IDs, and parent, protocol, and schedule hashes.
    resume_acceptance: A new-process 5-plus-5 update run exactly matches uninterrupted 10-update samples, parameters, logits, losses, and global update.
    tiers:
      T1: 10
      T2: 500
      T3: 2000
      T4: 10000
    evaluation_barrier: Stop all trainers at a tier, save immutable full state, evaluate all matched arms, then resume only if the tier gate passes.
