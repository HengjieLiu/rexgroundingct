    timeout_seconds: 28800
    retry: {class: training_and_evaluation, max_attempts: 3, max_automatic_resumes: 1}
    stop_conditions:
      - Correct fields fail to outperform zero, swap, and lobe-permuted arms.
      - Aggregate Dice loss exceeds 0.001 or hit loss exceeds one percentage point.
    acceptance_checks:
      - Correct-field explicit-modifier Dice improves by at least 0.01 or aggregate Dice improves by at least 0.003.
      - Aggregate Dice is no worse than control by more than 0.001.
      - Hit-rate loss is at most 0.01 and GT retention is at least 0.99.
