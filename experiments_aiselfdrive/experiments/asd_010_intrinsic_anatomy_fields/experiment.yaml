evaluation:
  development_cohort: val80
  internal_replication_cohort: val120
  continuity_cohort: val200
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  primary_metrics:
    - explicit_modifier_dice_delta
    - aggregate_dice_delta
    - prompt_off_location_fp_reduction
    - detached_off_location_component_reduction
    - gt_retention
    - hit_rate_delta
  secondary_metrics:
    - empty_mask_rate
    - precision_recall
    - predicted_volume
    - threshold_matched_delta
    - volume_matched_delta
    - parser_group_effects
    - size_focality_and_category_effects
  uncertainty: {bootstrap_draws: 10000, seed: 20260731, cluster_unit: case}
  diagnostic_go:
    gt_retention_min: 0.99
    off_location_fp_reduction_min: 0.15
    detached_off_location_component_reduction_alternative_min: 0.10
    require_correct_beats_all_causal_controls: true
  training_go:
    explicit_modifier_dice_delta_min: 0.01
    aggregate_dice_delta_alternative_min: 0.003
    aggregate_dice_noninferiority_margin: -0.001
    hit_rate_delta_min: -0.01
    gt_retention_min: 0.99
  internal_replication_go:
    primary_val120_case_clustered_ci_lower_bound_min_exclusive: 0.0
promotion_contract:
  artifact_id: promotion_record
  path: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/promotions/asd_010_intrinsic_anatomy_fields.json
  exact_producer: experimentctl promote
  required_fields: [schema_version, experiment_id, source, portfolio_sha256, plan_sha256, t3_evidence_sha256, rank, promoted_at, matched_control_required, val120_access_authorized]
  validation: Require matching experiment ID and plan hash, source experimentctl promote, matched_control_required true, val120_access_authorized true, and the SHA-256 recorded by the controller event and state.
