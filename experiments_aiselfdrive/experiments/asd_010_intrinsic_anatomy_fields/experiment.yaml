    checkpoint_sha256: 50e631f174ad4c16222df1d8114c30171df6e974cac5e934fa230448d91479bf
    optimizer_policy: Reset optimizer, momentum, AMP scaler, update counter, warmup, and polynomial horizon identically for all arms.
  preprocessing:
