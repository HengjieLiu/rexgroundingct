  ct_root: /mnt/shengdata1/hengjie/datasets/rexgroundingct/ct/dataset
  splits: [train, val]
  expected_cases: 3192
model:
  software: TotalSegmentator
  version: 2.16.0
  task: total
  fast: true
  spacing_mm: 3.0
  output_geometry: source
  docker_image_tag: rexgroundingct-totalsegmentator:2.16.0-cu126
  docker_local_image_id: sha256:047cfe9e32a9001de0f55d04bffdb1ad81bf59b8f9f7de049103cf5d15d0acb7
  docker_preflight_policy: docker_inspect_image_id_must_equal_local_image_id
  weights_root: /mnt/shengdata1/hengjie/models/totalsegmentator/2.16.0
  weights_tree_hash:
    algorithm: experimentctl_canonical_tree_sha256
    working_directory: /mnt/shengdata1/hengjie/models/totalsegmentator/2.16.0
    sha256: 2e4612f23850ef126664ee4672ddeda6340afed54f350d7955a4930a2cdfaa9e
    file_count: 105
    tree_size_bytes: 2345112197
    preflight_policy: recompute_and_require_exact_match
execution:
  shard_count: 4
  shard_function: sha256_case_name_first_16_hex_modulo_4
  gpus: [0, 1, 2, 3]
  minimum_free_gib: 32
  transient_attempts: 3
  transient_backoff_seconds: [60, 300]
validation:
  affine_absolute_tolerance: 0.00001
  physical_extent_mm_absolute_tolerance: 0.1
  allowed_label_range: [0, 117]
  require_all_five_lung_lobes_nonempty: true
  qc_seed: 20260731
  qc_random_cases: 20
budget:
