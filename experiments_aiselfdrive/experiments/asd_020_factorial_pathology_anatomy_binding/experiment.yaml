      predicate: Off-location FP, explicit-modifier Dice, GT retention, aggregate, and causal substitutions are decided.
    resources: {gpu_count: 2, gpu_memory_free_gib_min_each: 32, gpu_hours_per_arm_max: 1.25}
    timeout_seconds: 21600
    retry: {class: training_and_evaluation, max_attempts: 3, max_automatic_resumes: 1}
    stop_conditions:
      - Off-location FP reduction is below 15 percent.
      - GT retention is below 99 percent or aggregate Dice loss exceeds 0.001.
      - Correct spans do not outperform single and double swaps.
    acceptance_checks:
      - Prompt-off-location FP decreases at least 0.15.
      - Explicit-modifier Dice improves at least 0.01.
      - GT retention is at least 0.99 and aggregate Dice delta is at least -0.001.
  - id: t3_2000_update_val80
