    sha256: 1ce44b798f3e86ae8744435d6efc1bc52f23591723763e80b233038bfe172c1e
    allowed_split: train
    observed_train_records: 2992
    prohibited_splits: [val, test]
    observed_train_findings: 7687
    observed_box_tags: 20687
    note: Counts are discovery evidence; strict parsing determines the locked eligible set.
  val80_manifest: experiments_aiselfdrive/shared/manifests/val80_development_seed20260731.json
  val120_manifest: experiments_aiselfdrive/shared/manifests/val120_complement_seed20260731.sealed.json
  val200_manifest: configs/evaluation/rexgroundingct_val200_seed20260723.json
  val120_access:
    before_t4: prohibited
    allowed_stage: t4_confirmatory_binding
  supervision_policy:
    labels: [known_positive, certified_negative, unknown]
    known_positive: Released train mask overlap and the factual quartet cell.
    certified_negative: Factor swaps backed by a real region, incompatible official pathology category or explicit anatomy, and matched sampling.
    unknown: Malformed, ambiguous, unmatched, same-category-compatible, or incomplete-label regions.
    forbidden: Use of unvalidated COT prose as a global negative mask.
method:
  protocol_config: experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/configs/protocol.yaml
  cot_box_validation:
    tag_pattern: Literal box tag containing exactly six base-10 integers.
    coordinate_order: [x_min, y_min, z_min, x_max, y_max, z_max]
    bounds: Half-open voxel bounds with 0 <= minimum < maximum <= source array shape.
    anatomy_label_rule: >-
      Assign only the closest recognized lung/lobe phrase in the same numbered
      step before the box. Reject absent, conflicting, bilateral, segment-only,
      lesion-only, or multiply plausible labels.
    recognized_labels:
      - left_lung
      - right_lung
      - left_upper_lobe
      - left_lower_lobe
      - right_upper_lobe
      - right_middle_lobe
      - right_lower_lobe
    mask_overlap_validation: >-
      A box is eligible only when at least 80 percent of released GT voxels for
      its finding lie inside the box expanded by 15 physical mm, or when the box
      is explicitly labeled whole lung and at least 95 percent lie inside.
    malformed_policy: exclude_and_count
  text_spans:
    anatomy_span: Exact source substrings consumed by the locked prompt ontology.
    pathology_span: Original finding after replacing anatomy spans with spaces and normalizing whitespace and punctuation.
    exclusion: Fewer than three alphabetic pathology tokens, conflicting anatomy, or no explicit eligible anatomy.
    embeddings:
      - full_sentence
      - pathology_span
      - anatomy_span
    dimension: 2560
    dtype: float16
    encoder_frozen: true
  region_pooling:
    source_region: >-
      Released train lesion bounding box expanded by 10 physical mm, intersected
      with the validated COT anatomy box expanded by 15 physical mm.
    standard_features: Mean and max pooled common encoder skip vectors at one-quarter and one-half scales.
    s3_features: Standard features plus pooled prompt-conditioned S3 gated feature vectors at the same scales.
    frozen_backbones: true
    base_confidence: Mean sigmoid probability inside the released lesion mask from the corresponding frozen lineage.
  quartet_construction:
    anchor_requirement: Nonempty released train mask, valid anatomy box, valid spans, and all three matched counterexamples.
    cells:
      factual: same official pathology category and same explicit anatomy label.
      anatomy_swap: same pathology category and a different explicit side or lobe.
      pathology_swap: different official pathology category and the same explicit anatomy label.
      double_swap: different pathology category and different explicit side or lobe.
    matching:
      mask_volume_decile: same decile preferred, adjacent decile allowed.
      base_confidence_decile: same decile preferred, adjacent decile allowed.
      crop_voxel_count_relative_tolerance: 0.25
      source_case: must differ from anchor case for every swapped cell.
      deterministic_choice: Lowest SHA-256 of seed, anchor case, finding index, cell, and candidate identity.
    label_order: Seeded permutation per quartet; labels are not position-coded.
    split:
      unit: case
      heldout_fraction: 0.20
      rule: First 20 percent after sorting cases by SHA-256 of 20260731 colon case_name are held out.
    minimum_locked_quartets: 1000
    maximum_locked_quartets: 50000
  scorer:
    projections:
      region_dimension: 128
      pathology_dimension: 128
      anatomy_dimension: 128
    normalized_inputs: true
    components:
      pathology_bilinear: dot(region_projection, pathology_projection)
      anatomy_bilinear: dot(region_projection, anatomy_projection)
      interaction: Two-layer MLP over elementwise region-pathology, region-anatomy, and their elementwise product; hidden 256, GELU, dropout 0.1.
    output: one scalar compatibility score per real region
    loss: Four-way InfoNCE cross-entropy within each quartet plus equal-weight pathology-match and anatomy-match binary auxiliary losses.
    loss_weights: {info_nce: 1.0, pathology_match: 0.25, anatomy_match: 0.25}
    temperature: Learned, initialized 0.07, clamped to [0.03, 0.20].
    optimizer: AdamW
    learning_rate: 0.0003
    weight_decay: 0.01
    batch_quartets: 32
    seed: 20260731
  probe_controls:
    - text_only
    - whole_sentence_only
    - pathology_only
    - anatomy_only
    - additive_without_interaction
    - shuffled_anatomy_spans
    - pathology_swap
    - anatomy_swap
    - double_swap
    - zero_residual_identity
  lineage_selection:
    primary: Higher case-heldout four-way top-1 accuracy after all shortcut and margin gates pass.
    tie_break: Standard parent because it has higher locked aggregate val200 Dice.
    fit_repetitions: 3
    seeds: [20260731, 20260732, 20260733]
    reporting: Mean and worst-seed result; every seed must pass the primary gate.
  bounded_component_residual:
    candidates: 26-connected components of sigmoid base probability at threshold 0.05.
    score_features: Same frozen selected-lineage pooling and frozen text spans used by the probe.
    formula: z_final equals z_base plus beta times tanh of component compatibility centered on the train-heldout factual/nonfactual midpoint.
    beta_parameterization: beta = 2.0 * tanh(raw_beta)
    initialization: raw_beta equals 0 with an exact base-logit bypass.
    application: Add one bounded residual to voxels belonging to each threshold-0.05 component; leave all other logits unchanged.
    decision: Continuous recalibration only; never hard keep/drop.
  tier_updates:
    T1: 10
    T2: 500
    T3: 2000
    T4: 10000
  evaluation_barrier: Save immutable scorer/full-state checkpoints, stop fitting, evaluate matched zero and interaction arms, then resume only after gates pass.
resources:
  execution_class: four_gpu_frozen_feature_export_then_small_probe
  gpu_count_max: 4
  gpu_memory_free_gib_min_feature_export: 32
  gpu_memory_free_gib_min_inference: 32
  docker_image: rexgroundingct-voxtell:cu126
  gpu_preflight_ref: experiments_aiselfdrive/shared/hardware_profile.yaml
  qwen_and_voxtell_frozen: true
  use_multi_gpu_ddp: false
  cpu_threads_max: 32
  ram_gib_max: 192
stages:
  - id: implement_factorial_binding_pipeline
    kind: implementation
    execution_mode: agent
    needs: []
    required: true
    description: Implement strict COT parsing, quartet construction, feature export, interaction probes, bounded residual, evaluation, and tests.
    instructions: >-
      Create cot_boxes.py, quartets.py, binding_model.py, component_residual.py,
      a run_stage.py CLI, and focused tests. run_stage.py must expose corpus,
      features, probe, t1, t2, t3, t4, and closeout. Parse train COT only;
      lists, nulls, malformed tags, ambiguous labels, and unmatched boxes are
      excluded and counted. Keep Qwen and both VoxTell lineages frozen and prove
      their weights unchanged. Use atomic external feature shards and case-level
      splits. The text-only control must receive identical anchor text across
      all four randomly ordered cells. The residual beta==0 path must return
      base logits exactly. Reject val120 outside t4. Modify no existing code.
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/src/cot_boxes.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/src/quartets.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/src/binding_model.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/src/component_residual.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/scripts/run_stage.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/tests/test_cot_boxes.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/tests/test_quartets.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/tests/test_binding_model.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/tests/test_component_residual.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/tests/test_shortcuts_and_leakage.py
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/implement_factorial_binding_pipeline.json
    inputs:
      - protocol, locked foundation manifests, anatomical COT, released train masks, and frozen checkpoints
    outputs:
      - experiment-local implementation, CLI, and unit tests
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/implement_factorial_binding_pipeline.json
      predicate: Modules compile and all strict parsing, shortcut, identity, frozen-weight, and leakage tests pass.
    resources: {gpu_count: 0, cpu_threads: 8}
    timeout_seconds: 10800
    retry: {class: non_retryable_agent_implementation, max_attempts: 1}
    stop_conditions:
      - Any requested write is outside allowed_write_paths.
      - COT val/test data or val120 labels are opened.
      - Quartet labels can be inferred from text or cell order alone.
    acceptance_checks:
      - PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/tests -p test_*.py
      - python -m py_compile experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/src/*.py experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/scripts/*.py
  - id: lock_train_factorial_corpus
    kind: data_preparation
    execution_mode: command
    needs: [implement_factorial_binding_pipeline]
    required: true
    description: Validate train-only boxes and construct a balanced immutable quartet corpus.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/configs/protocol.yaml, --phase, corpus]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/corpus_audit.json
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/corpus_exclusions.csv
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_020_factorial_pathology_anatomy_binding/corpus
    inputs:
      - train split of anatomical COT, released train masks, metadata, and locked prompt ontology
    outputs:
      - immutable external quartet manifest and span table
      - corpus audit and exclusions table
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/corpus_audit.json
      predicate: At least 1,000 complete balanced quartets pass all box, matching, split, and shortcut checks.
    resources: {gpu_count: 0, cpu_threads: 32, ram_gib_max: 128}
    timeout_seconds: 21600
    retry: {class: transient, max_attempts: 3, backoff_seconds: [60, 300]}
    stop_conditions:
      - Fewer than 1000 eligible complete quartets remain.
      - Case split, source split, mask, or box validation fails.
    acceptance_checks:
      - Only COT train records are present.
      - Every quartet has exactly one cell of each factorial type and random label position.
      - No case appears in both fit and held-out sets.
  - id: export_frozen_text_and_region_features
    kind: feature_extraction
    execution_mode: command
    needs: [lock_train_factorial_corpus]
    required: true
    description: Export standard, S3, and three-span frozen features in four deterministic shards.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/configs/protocol.yaml, --phase, features]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/feature_export.json
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_020_factorial_pathology_anatomy_binding/features
    inputs:
      - locked quartet corpus, standard and S3 checkpoints, Qwen pipeline, and CT cache
    outputs:
      - atomic external feature shards and manifest
      - feature export audit
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/feature_export.json
      predicate: Every quartet has finite standard, S3, and span features and all frozen hashes remain unchanged.
    resources: {gpu_count: 4, gpu_memory_free_gib_min_each: 32, docker_image: rexgroundingct-voxtell:cu126, gpu_hours_total_max: 24}
    timeout_seconds: 43200
    retry: {class: evaluation, max_attempts: 3, preserve_verified_cases: true}
    stop_conditions:
      - Qwen or VoxTell frozen parameters change.
      - Feature geometry, case identity, dtype, or finite checks fail.
      - Total export exceeds 24 GPU-hours.
    acceptance_checks:
      - Feature count equals four times the locked quartet count for both lineages.
      - Span embeddings have shape 2560 and use the identical frozen encoder contract.
      - Standard and S3 parent hashes are unchanged after extraction.
  - id: train_and_gate_factorial_probes
    kind: diagnostic
    execution_mode: command
    needs: [export_frozen_text_and_region_features]
    required: true
    description: Fit three seeds for both lineages and every ablation, then select at most one lineage.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/configs/protocol.yaml, --phase, probe]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/probe.json
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/probe_metrics.csv
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/probe_summary.md
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_020_factorial_pathology_anatomy_binding/probes
    inputs:
      - frozen feature manifest and locked fit/held-out quartets
    outputs:
      - immutable probe checkpoints and complete ablation results
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/probe.json
      predicate: Shortcut, accuracy, margin, ablation, seed, and lineage-selection gates are decided.
    resources: {gpu_count: 2, gpu_memory_free_gib_min_each: 8, gpu_hours_total_max: 4}
    timeout_seconds: 14400
    retry: {class: transient, max_attempts: 3, backoff_seconds: [60, 300]}
    stop_conditions:
      - Text-only held-out top-1 exceeds 30 percent after one deterministic rebalance.
      - Any seed is below 65 percent top-1 or below the sentence-only control by 10 percentage points.
      - Either one-factor margin is nonpositive.
    acceptance_checks:
      - Text-only accuracy is at most 0.30 on a balanced randomly ordered task.
      - Every selected-lineage seed has top-1 at least 0.65 and at least 0.10 advantage over sentence-only.
      - Factual scores exceed both pathology-swap and anatomy-swap scores with positive case-clustered margins.
  - id: t1_zero_residual_smoke
    kind: smoke
    execution_mode: command
    needs: [train_and_gate_factorial_probes]
    required: true
    description: Materialize the winning scorer and prove exact zero residual on one val80 case plus ten fit updates.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/configs/protocol.yaml, --phase, t1]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
    allowed_write_paths:
      - experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/t1.json
      - /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_020_factorial_pathology_anatomy_binding/runs
    inputs:
      - selected frozen lineage, winning probe, val80 manifest, and base logits
    outputs:
      - exact-identity evidence and external smoke state
    completion:
      evidence_file: experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/results/t1.json
      predicate: Zero residual is bitwise identical and ten finite scorer updates resume exactly.
    resources: {gpu_count: 1, gpu_memory_free_gib_min: 32, gpu_hours_max: 0.25}
    timeout_seconds: 7200
    retry: {class: training, max_attempts: 2, max_automatic_resumes: 1}
    stop_conditions:
      - Probe gate is not GO.
      - Zero residual changes any base logit or mask.
      - Frozen lineage weights change.
    acceptance_checks:
      - raw_beta zero returns the exact base tensor.
      - Frozen Qwen and VoxTell hashes remain unchanged.
      - Ten updates, checkpoint, resume, and one-case inference are finite.
  - id: t2_500_update_val80
    kind: training_evaluation
    execution_mode: command
    needs: [t1_zero_residual_smoke]
    required: true
    description: Fit matched zero and interaction arms for 500 updates and evaluate val80.
    command:
      argv: [python, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/scripts/run_stage.py, --config, experiments_aiselfdrive/experiments/asd_020_factorial_pathology_anatomy_binding/configs/protocol.yaml, --phase, t2]
      cwd: /home/hengjie/code_sync/rexgroundingct
      env: {PYTHONDONTWRITEBYTECODE: "1"}
