evaluation:
  probe_cohort: case_separated_train_heldout_20_percent
  development_cohort: val80
  confirmatory_cohort: val120
  continuity_cohort: val200
  probe_go:
    four_way_top1_min: 0.65
    advantage_over_sentence_only_min: 0.10
    text_only_top1_max: 0.30
    factual_minus_pathology_swap_margin_min_exclusive: 0.0
    factual_minus_anatomy_swap_margin_min_exclusive: 0.0
    every_seed_must_pass: true
  performance_go:
    off_location_fp_reduction_min: 0.15
    explicit_modifier_dice_delta_min: 0.01
    gt_retention_min: 0.99
    aggregate_dice_noninferiority_margin: -0.001
  confirmatory_go:
    val120_case_clustered_ci_lower_bound_min_exclusive: 0.0
  metrics:
    - four_way_top1
    - pathology_and_anatomy_match_accuracy
    - single_swap_margins
    - text_only_and_ablation_accuracy
    - prompt_off_location_fp
    - explicit_modifier_and_aggregate_dice
    - gt_retention
    - hit_and_empty_mask_rate
    - threshold_and_volume_matched_effects
  uncertainty: {bootstrap_draws: 10000, seed: 20260731, cluster_unit: case}
