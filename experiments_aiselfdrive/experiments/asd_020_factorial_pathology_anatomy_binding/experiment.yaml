schema_version: "1.0"
id: asd_020_factorial_pathology_anatomy_binding
title: Four-cell real-region pathology and anatomy interaction probe with bounded component residual
plan_revision: 1
created_at: "2026-07-31T00:00:00Z"
updated_at: "2026-07-31T00:00:00Z"
priority: 4
idea: >-
  Train an explicit interaction scorer on balanced real-region quartets that
  independently corrupt pathology and anatomy compatibility, then use it only
  as an identity-initialized bounded component-logit residual.
problem: >-
  Text is active but spatially broad. Generic attention and independent
  selectors did not learn whether a visual region jointly matches both the
  disease description and its anatomical modifier.
novelty_vs_report: >-
  Instead of another attention block or prompt adapter, this plan isolates the
  pathology-by-anatomy conjunction with a 2-by-2 counterexample design,
  case-separated frozen-feature probes, lexical shortcut controls, and
  correct/single-swap/double-swap causal margins.
hypotheses:
  primary: >-
    A visual-text interaction scorer reaches at least 65 percent held-out
    four-way top-1 accuracy, beats sentence-only by at least 10 percentage
    points, and assigns positive margins over both one-factor swaps.
  null: >-
    Region features cannot separate the conjunction beyond lexical,
    pathology-only, anatomy-only, additive, or shuffled controls.
goals:
  - Validate train-only anatomical COT boxes without trusting malformed or unlabeled boxes.
  - Build balanced, case-separated, matched real-region quartets.
  - Compare standard and S3 frozen region representations.
  - Gate any prediction coupling on mechanistic probe success and exact identity.
  - Measure prompt-off-location FP and Dice effects on val80, with val120 only after promotion.
non_goals:
  - Fine-tune Qwen or claim that the text pathway was previously inactive.
  - Use COT val/test entries or validation labels to fit the probe.
  - Treat free-text COT boxes as pathology ground truth.
  - Add anatomy embeddings directly to the decoder query.
  - Make hard independent keep/drop component decisions.
