  runtime_root: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_020_factorial_pathology_anatomy_binding
  runtime_symlink_target: /mnt/shengdata1/hengjie/experiments/rexgroundingct/aiselfdrive/asd_020_factorial_pathology_anatomy_binding
budget:
